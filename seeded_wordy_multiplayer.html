<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Seeded Wordy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
/* Layout concept: a dark felt table with a swirling CRT background. Chunky panels with hard drop shadows
   hold the score, the tile board and the clue hand; every action opens a bottom sheet. Phone-first single column. */
:root {
  --bg-deep: #081c1c;
  --bg-red: #4d1427;
  --bg-blue: #10294d;
  --panel: #223539;
  --panel-hi: #3d565c;
  --panel-lo: #111d20;
  --ink: #f4f2e9;
  --ink-dim: #a3b8ba;
  --red: #fe5f55;
  --red-lo: #a8352d;
  --blue: #1ba4ff;
  --blue-lo: #0c6aaf;
  --gold: #f7b92f;
  --gold-lo: #94670d;
  --green: #4fd09a;
  --green-lo: #278a63;
  --cons: #ee5646;
  --cons-lo: #9c3126;
  --vowel: #6584a8;
  --vowel-lo: #3a5373;
  --card: #eef2ef;
  --card-ink: #17262a;
  --vanilla: #62808e;
  --spicy: #e8473b;
  --font-display: 'Lilita One', 'Fredoka', system-ui, sans-serif;
  --font-body: 'Fredoka', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-label: 'Fredoka', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg-deep);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.35;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 60; background: var(--bg-deep);
}
button { font-family: inherit; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.swirl {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  background:
    radial-gradient(60% 50% at 20% 25%, var(--bg-red), transparent 72%),
    radial-gradient(55% 55% at 85% 20%, var(--bg-blue), transparent 72%),
    radial-gradient(70% 60% at 50% 95%, #0f3d38, transparent 72%),
    var(--bg-deep);
  background-size: 150% 150%, 150% 150%, 150% 150%, auto;
  animation: drift 26s ease-in-out infinite alternate;
}
.swirl::after {
  content: ""; position: absolute; inset: 0;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.2) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.6) 100%);
}
@keyframes drift {
  from { background-position: 0% 0%, 100% 0%, 50% 100%, 0 0; }
  to { background-position: 40% 25%, 60% 35%, 40% 70%, 0 0; }
}

.wrap { position: relative; z-index: 1; max-width: 560px; margin-inline: auto; padding-block: 14px 130px; display: flex; flex-direction: column; gap: 16px; }

/* Panels and buttons */
.panel {
  background: var(--panel); border: 3px solid var(--panel-hi); border-radius: 14px;
  box-shadow: 0 5px 0 var(--panel-lo), 0 12px 20px rgba(0,0,0,.35); padding: 14px; min-width: 0;
}
.lbl { font-family: var(--font-label); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 8px; }
.btn {
  --bc: var(--blue); --bl: var(--blue-lo);
  font-weight: 700; font-size: 18px; letter-spacing: .05em; text-transform: uppercase; color: #fff;
  border: 0; border-radius: 12px; padding: 12px 16px; min-height: 52px; cursor: pointer;
  background: var(--bc); box-shadow: 0 5px 0 var(--bl), inset 0 0 0 2px rgba(255,255,255,.18);
  transition: transform .08s, box-shadow .08s; text-shadow: 0 2px 0 rgba(0,0,0,.25);
}
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--bl), inset 0 0 0 2px rgba(255,255,255,.18); }
.btn.red { --bc: var(--red); --bl: var(--red-lo); }
.btn.gold { --bc: var(--gold); --bl: var(--gold-lo); color: #2a1c00; text-shadow: none; }
.btn.grey { --bc: var(--panel-hi); --bl: var(--panel-lo); }
.btn.green { --bc: var(--green); --bl: var(--green-lo); color: #06281b; text-shadow: none; }
.btn.wide { width: 100%; }
.btn.sm { font-size: 15px; min-height: 44px; padding: 8px 12px; }
.btn:disabled { filter: grayscale(.9) brightness(.65); cursor: not-allowed; }
.link { background: none; border: 0; color: var(--ink-dim); text-decoration: underline; font-size: 15px; padding: 10px 4px; cursor: pointer; }

/* Live multiplayer status pill & pulse banner */
.mp-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: #0c171a; border: 2px solid var(--panel-hi); border-radius: 12px; padding: 8px 12px;
  font-size: 14px;
}
.mp-dot {
  display: inline-block; width: 10px; height: 10px; border-radius: 50%;
  background: var(--green); margin-right: 6px; box-shadow: 0 0 8px var(--green);
}
.mp-dot.wait { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.pulse-btn { animation: pulseGlow 1.6s ease-in-out infinite; }
@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 5px 0 var(--gold-lo), 0 0 0 0 rgba(247,185,47,.6); }
  50% { box-shadow: 0 5px 0 var(--gold-lo), 0 0 0 10px rgba(247,185,47,0); }
}

/* Logo */
.logo { text-align: center; padding-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 0; }
.logo .l1, .logo .l2 {
  font-size: clamp(54px, 19vw, 92px); font-weight: 700; line-height: .95; letter-spacing: .02em;
  -webkit-text-stroke: 8px #0b1517; paint-order: stroke fill; text-shadow: 0 7px 0 #0b1517;
}
.logo .l1 { color: var(--red); transform: rotate(-4deg); animation: bob 4.5s ease-in-out infinite; }
.logo .l2 { color: var(--gold); transform: rotate(2deg); animation: bob 4.5s ease-in-out -2s infinite; }
@keyframes bob { 0%,100% { translate: 0 0; } 50% { translate: 0 -5px; } }
.mini { font-weight: 700; font-size: 22px; letter-spacing: .06em; color: var(--gold); -webkit-text-stroke: 4px #0b1517; paint-order: stroke fill; }

/* Seed screen */
.txt {
  width: 100%; font: inherit; font-size: 22px; font-weight: 600; color: var(--ink);
  background: #0c171a; border: 3px solid var(--panel-hi); border-radius: 12px; padding: 12px 14px; min-height: 54px;
}
.txt::placeholder { color: #5f777c; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 17px; }
.steps li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.steps i { font-style: normal; font-family: var(--font-label); font-size: 12px; background: var(--gold); color: #2a1c00; border-radius: 8px; width: 30px; height: 30px; display: grid; place-items: center; box-shadow: 0 3px 0 var(--gold-lo); }
.sub { color: var(--ink-dim); font-size: 16px; }
.sub b { color: var(--ink); }

/* Pool card toggle items */
.pool-list { display: flex; flex-direction: column; gap: 8px; }
.pcard {
  display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; align-items: center;
  width: 100%; text-align: left; border: 3px solid var(--panel-hi); border-radius: 12px;
  background: #0c171a; color: var(--ink); padding: 9px 12px; cursor: pointer;
  transition: transform .08s, border-color .12s, opacity .12s;
}
.pcard.on { border-color: var(--green); background: rgba(79, 208, 154, .1); }
.pcard.off { opacity: .52; border-color: #26393d; }
.pcard .pcost {
  font-family: var(--font-display); font-size: 22px; line-height: 1; text-align: center;
  border-radius: 8px; padding: 6px 0; color: #fff; background: var(--vanilla);
}
.pcard.s .pcost { background: var(--spicy); }
.pcard .pinfo b { display: block; font-size: 16px; line-height: 1.15; }
.pcard .pinfo small { display: block; color: var(--ink-dim); font-size: 13px; margin-top: 2px; }
.pcard .pchk {
  font-family: var(--font-display); font-size: 13px; letter-spacing: .04em; text-transform: uppercase;
  padding: 5px 9px; border-radius: 8px; background: var(--green); color: #05281a;
}
.pcard.off .pchk { background: var(--panel-lo); color: var(--ink-dim); }

/* Tiles */
.tile {
  --tc: var(--cons); --tl: var(--cons-lo);
  position: relative; width: 44px; height: 50px; border-radius: 9px; border: 0; padding: 0;
  background: var(--tc); color: #fff; font-weight: 700; font-size: 27px; line-height: 1;
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.28), 0 4px 0 var(--tl);
  display: grid; place-items: center; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  text-shadow: 0 2px 0 rgba(0,0,0,.28);
}
.tile.vow { --tc: var(--vowel); --tl: var(--vowel-lo); }
.tile[data-bt] { touch-action: none; }
.tile.ghost { background: transparent; box-shadow: inset 0 0 0 2px rgba(255,255,255,.12); pointer-events: none; }
.tile.off { opacity: .3; cursor: not-allowed; }
.tile.dragging { opacity: .25; }
.tile.fly { position: fixed; z-index: 9999; pointer-events: none; transform: translate(-50%, -62%) rotate(-7deg) scale(1.15); box-shadow: inset 0 0 0 3px rgba(255,255,255,.3), 0 14px 18px rgba(0,0,0,.5); }
.tile.flipped { background: #0e1a1d; box-shadow: inset 0 0 0 3px #2c4247; color: transparent; }
.tile.on { outline: 3px solid var(--gold); outline-offset: 2px; }
.tile.mini { width: 38px; height: 44px; font-size: 23px; cursor: default; }
.tile .bdg {
  position: absolute; left: 50%; bottom: -13px; transform: translateX(-50%); z-index: 2;
  font-family: var(--font-label); font-size: 9px; letter-spacing: .04em; padding: 2px 4px; border-radius: 5px; white-space: nowrap;
  background: var(--green); color: #05281a; text-shadow: none; box-shadow: 0 2px 0 var(--green-lo);
}
.tile.out { opacity: .45; }
.tile.out::after { content: ""; position: absolute; left: 4px; right: 4px; top: 50%; height: 3px; background: #0b1517; transform: rotate(-24deg); }
.tile.out .bdg { background: #0b1517; color: var(--red); box-shadow: none; }
.tile.in { outline: 3px solid var(--green); outline-offset: 1px; }
.board { display: flex; flex-wrap: wrap; gap: 8px 7px; padding-bottom: 14px; }

.builder { display: flex; flex-direction: column; gap: 14px; }
.wordrow {
  min-height: 78px; border: 3px dashed var(--panel-hi); border-radius: 12px; padding: 10px;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: rgba(0,0,0,.2);
}
.wordrow.hot { border-color: var(--gold); background: rgba(247,185,47,.08); }
.wordrow .empty { color: #6b8388; font-size: 16px; }
.rack { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 6px 0; }
.rack.hot { background: rgba(255,255,255,.04); border-radius: 12px; }

/* Tile pool: tiles snap to an invisible 6 x 4 grid of points */
.pool { position: relative; width: 100%; max-width: 372px; margin: 0 auto; aspect-ratio: 6 / 4.48; border-radius: 12px; background: rgba(0,0,0,.16); }
.pool.hot { background: rgba(255,255,255,.08); }
.slot { position: absolute; left: calc(var(--c) * 100% / 6); top: calc(var(--r) * 100% / 4); width: calc(100% / 6); height: 25%; padding: 3px; transition: left .14s ease-out, top .14s ease-out; }
.slot .tile { width: 100%; height: 100%; font-size: clamp(24px, 7.6vw, 32px); }
.slot .tile .bdg { bottom: auto; top: 3px; left: auto; right: 3px; transform: none; font-size: 8px; padding: 1px 3px; }

.enter .tile.deal, .enter .card { animation: dealin .5s cubic-bezier(.2,.9,.3,1.25) both; animation-delay: calc(var(--i, 0) * 55ms); }
@keyframes dealin { from { opacity: 0; transform: translateY(-46px) rotate(-14deg) scale(.8); } to { opacity: 1; transform: none; } }

/* Scoreboard */
.score { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; }
.sbox { border-radius: 12px; padding: 8px 10px; text-align: center; box-shadow: 0 5px 0 rgba(0,0,0,.4), inset 0 0 0 3px rgba(255,255,255,.14); min-width: 0; }
.sbox .k { font-family: var(--font-label); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; opacity: .9; }
.sbox .n { font-size: 44px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; text-shadow: 0 3px 0 rgba(0,0,0,.3); }
.sbox.r { background: var(--red); }
.sbox.b { background: var(--blue); }
.sbox.g { background: var(--gold); color: #2a1c00; }
.sbox.g .n { text-shadow: none; }
.sbox.r .n.bump { animation: bump .5s cubic-bezier(.2,1.6,.4,1); }
@keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.4) rotate(-4deg); } 100% { transform: scale(1); } }

.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.seedchip { --bc: var(--panel); --bl: var(--panel-lo); font-size: 14px; min-height: 40px; padding: 6px 12px; text-transform: none; letter-spacing: .02em; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.pills { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; }
.pill { background: #0c171a; border: 2px solid var(--panel-hi); border-radius: 10px; padding: 6px 2px; text-align: center; min-width: 0; }
.pill span { display: block; font-family: var(--font-label); font-size: 9px; letter-spacing: .06em; color: var(--ink-dim); }
.pill b { font-size: 22px; font-variant-numeric: tabular-nums; }
.pill b.q { color: #4c6367; }
.note { margin-top: 8px; font-size: 15px; color: var(--ink-dim); }
.note b { color: var(--ink); }

/* Cards */
.hand { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card {
  --cc: var(--vanilla);
  position: relative; display: flex; flex-direction: column; gap: 6px; text-align: left; min-width: 0;
  border: 0; border-radius: 12px; background: var(--card); color: var(--card-ink); padding: 8px 10px 0; min-height: 158px; cursor: pointer;
  box-shadow: 0 5px 0 rgba(0,0,0,.5), 0 12px 16px rgba(0,0,0,.35); transition: transform .15s ease;
}
.card.s { --cc: var(--spicy); }
.card:hover { transform: translateY(-5px) rotate(-1.5deg); }
.card:active { transform: translateY(1px); }
.card .ctop { display: flex; justify-content: space-between; align-items: center; }
.card .cost { font-size: 34px; font-weight: 700; line-height: 1; color: var(--cc); }
.card .tag { font-family: var(--font-label); font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: var(--cc); border: 2px solid var(--cc); border-radius: 6px; padding: 2px 5px; }
.card .crule { font-size: 14px; line-height: 1.2; flex: 1; }
.card .banner { margin: 0 -10px; padding: 7px 10px 8px; background: var(--cc); color: #fff; border-radius: 0 0 12px 12px; font-weight: 700; font-size: 15px; text-transform: uppercase; line-height: 1.05; letter-spacing: .02em; }
.card .banner small { display: block; font-weight: 400; font-size: 11px; opacity: .85; text-transform: none; margin-top: 2px; }
.card .used { position: absolute; top: -8px; right: -6px; background: var(--gold); color: #2a1c00; font-weight: 700; font-size: 13px; border-radius: 8px; padding: 1px 6px; box-shadow: 0 3px 0 var(--gold-lo); }

/* Log */
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.log li { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; background: #0c171a; border-radius: 10px; padding: 8px 10px; }
.log .lc { font-weight: 700; font-size: 18px; text-align: center; color: #fff; background: var(--red); border-radius: 8px; padding: 3px 0; box-shadow: 0 3px 0 var(--red-lo); }
.log .lc.z { background: var(--green); color: #05281a; box-shadow: 0 3px 0 var(--green-lo); }
.log b { display: block; font-size: 16px; }
.log span.t { color: var(--ink-dim); font-size: 15px; overflow-wrap: anywhere; }
.empty-note { color: #6b8388; }

/* Bottom bar */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 28px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(transparent, rgba(4,11,13,.94) 45%); }
.bar-in { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; }
.bar-in .btn { flex: 1; }
.bar-in .btn.big { flex: 2; }

/* Sheet */
.backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(3,9,11,.75); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; max-height: 92dvh; display: flex; flex-direction: column; background: var(--panel);
  border: 3px solid var(--panel-hi); border-bottom: 0; border-radius: 18px 18px 0 0; box-shadow: 0 -6px 0 var(--panel-lo); animation: rise .24s ease-out;
}
@keyframes rise { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); }
.sheet-head h2 { font-size: 26px; line-height: 1.05; text-wrap: balance; }
.x { background: var(--panel-lo); color: var(--ink); border: 0; border-radius: 10px; width: 44px; height: 44px; font-size: 20px; font-weight: 700; cursor: pointer; flex: none; }
.sheet-body { overflow: auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); flex: 1; display: flex; flex-direction: column; gap: 14px; }
.sheet-foot { display: flex; gap: 10px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); border-top: 3px solid var(--panel-lo); background: rgba(0,0,0,.15); }
.sheet-foot .btn { flex: 1; }
.sheet-foot .btn.big { flex: 2; }
.kindrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tagx { font-family: var(--font-label); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: #fff; border-radius: 7px; padding: 4px 7px; }
.tagx.v { background: var(--vanilla); }
.tagx.s { background: var(--spicy); }
.costline { color: var(--gold); font-size: 17px; font-weight: 600; }
.rule { font-size: 17px; }
.say { background: #0b1619; border: 3px dashed var(--gold); border-radius: 12px; padding: 12px 14px; font-size: 21px; line-height: 1.25; }
.say .lbl { color: var(--gold); margin-bottom: 6px; }
.warn { background: rgba(254,95,85,.14); border: 2px solid var(--red); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
.okbox { background: rgba(79,208,154,.14); border: 2px solid var(--green); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
.grid { display: grid; gap: 8px; grid-template-columns: repeat(6, 1fr); }
.grid.g3 { grid-template-columns: repeat(3, 1fr); }
.grid.g2 { grid-template-columns: repeat(2, 1fr); }
.chip { font-weight: 700; font-size: 20px; min-height: 48px; border-radius: 10px; border: 3px solid var(--panel-hi); background: var(--panel-lo); color: var(--ink); cursor: pointer; padding: 4px; line-height: 1.05; }
.chip.on { background: var(--gold); border-color: #fff; color: #2a1c00; }
.chip.sm { font-size: 16px; }
.flips { display: flex; flex-wrap: wrap; gap: 10px; }
.big-n { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.peek { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; background: rgba(0,0,0,.25); border-radius: 12px; min-height: 76px; align-items: center; }
.revmark { position: absolute; top: -9px; right: -7px; font-family: var(--font-label); font-size: 8px; background: var(--gold); color: #2a1c00; border-radius: 5px; padding: 2px 4px; }
.stamp { font-size: clamp(40px, 14vw, 64px); font-weight: 700; color: var(--green); -webkit-text-stroke: 6px #0b1517; paint-order: stroke fill; transform: rotate(-4deg); text-align: center; text-shadow: 0 5px 0 #0b1517; }
.stamp.f { color: var(--red); }
.final { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.final .big-n { font-size: 96px; color: var(--red); -webkit-text-stroke: 6px #0b1517; paint-order: stroke fill; text-shadow: 0 6px 0 #0b1517; }
.final-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
.final-grid .final .big-n { font-size: 64px; }
.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 18px; padding: 6px 0; border-bottom: 2px dotted var(--panel-hi); }
.kv:last-child { border-bottom: 0; }

/* ---------- Seeded random ---------- */
function xmur3(str) {
  let h = 1779033703 ^ str.length;

function normSeed(s) { return String(s).trim().toLowerCase().replace(/\s+/g, ' '); }

  const vb = [], cb = [];
  for (const k in VOW) for (let i = 0; i < VOW[k]; i++) vb.push(k);
  for (const k in CON) for (let i = 0; i < CON[k]; i++) cb.push(k);
  const v = shuffle(vb, rnd).slice(0, 4).sort();

}
function getDisabled() { return Array.isArray(S && S.disabledCards) ? S.disabledCards : []; }

/* ---------- Tile helpers ---------- */
function myTileSet() { return (S.myTiles && S.myTiles.length === 11) ? S.myTiles : S.tiles; }

/* ---------- Clue cards ---------- */
const CL = {
  first: { k: 'v', name: 'First Letter', bird: 'Dinowlsaur', cost: 4, s: 'Their first letter.', full: 'Your friend tells you the first letter of their secret word.', inp: 'none', ans: 'letter', q: function () { return 'What is the first letter of your word?'; } },

/* ---------- State ---------- */
function fresh(keepDis) {

/* ---------- Firebase Online Room Sync ---------- */
function detachRoom() {
  if (unsubRoom) { try { unsubRoom(); } catch (e) {} unsubRoom = null; }
  roomData = null;
  lastPendingCount = 0;
}

function getPendingReqsForMe() {
  if (!roomData || !roomData.reqs || !S.online) return [];
  return Object.keys(roomData.reqs)
    .map(function (k) { return Object.assign({ _k: k }, roomData.reqs[k]); })
    .filter(function (r) { return r && r.to === S.role && r.status === 'pending'; });
}

function attachRoom(roomId) {
  detachRoom();
  if (!db || !roomId) return;
  const rRef = ref(db, 'rooms/' + roomId);
  unsubRoom = onValue(rRef, function (snap) {
    roomData = snap.val();
    if (!roomData) return;

    /* 1. Sync my revealed indices from Firebase if opponent auto-revealed one of my tiles */
    const me = myPlayer();
    if (me && Array.isArray(me.revealed)) {
      me.revealed.forEach(function (idx) {
        if (S.myRev.indexOf(idx) < 0) S.myRev.push(idx);
      });
    }

    /* 2. Auto-advance from waiting room to play once opponent locks in */
    const opp = oppPlayer();
    if (S.stage === 'wait' && opp && opp.ready) {
      S.stage = 'play';
      ui.enter = true;
      toast('Both players ready! Game on!', true);
      window.scrollTo(0, 0);
    }

    /* 3. Process incoming free intel from opponent's Let's Share / Give and Take */
    const myIntel = roomData.intel && roomData.intel[S.role];
    if (myIntel) {
      Object.keys(myIntel).forEach(function (k) {
        if (S.seenIntel.indexOf(k) >= 0) return;
        S.seenIntel.push(k);
        const item = myIntel[k];
        S.log.push({ id: item.id, cost: 0, d: item.d, fromOpp: true });

    /* 4. Process answered interactive requests that I sent */
    if (roomData.reqs) {
      Object.keys(roomData.reqs).forEach(function (k) {
        const req = roomData.reqs[k];
        if (!req || req.from !== S.role || req.status !== 'answered') return;
        if (S.seenReqs.indexOf(k) >= 0) return;
        S.seenReqs.push(k);
        applyOnlineAnswer(req);
      });
    }

    /* 5. Notify if a new incoming request arrived for me to answer */
    const pend = getPendingReqsForMe();
    if (pend.length > lastPendingCount) {
      toast('Friend asked: ' + CL[pend[0].clueId].name + '!');
    }
    lastPendingCount = pend.length;

    /* If I had a request modal open that was already answered, close it */
    if (ui.sheet === 'ansreq' && !pend.some(function (r) { return r._k === ui.reqId; })) {
      ui.sheet = null; ui.reqId = null; ui.reqAns = {};
    }

    refresh();
  }, function (err) {
    console.error('Room listener error:', err);
  });
}

  if (!S.online || !db || !S.room) return;
  const clueN = S.log.filter(function (e) { return e.id !== 'guess' && !e.fromOpp; }).length;

    case 'rhyme': d = { text: ans.text || '' }; break;
    case 'vowel': d = { letter: ans.letter || null }; break;
    case 'give': d = { mine: req.payload.mine, theirs: ans.letter || null }; break;
    case 'super': d = { letter: req.payload.letter, yes: !!ans.yes, pos: ans.yes ? ans.pos : null }; break;

  S.log.push({ id: id, cost: req.cost || 0, d: d });

/* Auto-resolve or dispatch an online clue card */
async function executeOnlineClue(f) {
  const opp = oppPlayer();
  if (!opp || !opp.wordStr) {
    toast('Waiting for friend to lock in their word...');
    return;
  }
  const c = CL[f.id];
  const oppWord = opp.wordStr.toUpperCase();
  const oppRev = Array.isArray(opp.revealed) ? opp.revealed.slice() : [];

  /* Block Let's Share / Give and Take if friend already solved your word */
  if ((f.id === 'share' || f.id === 'give') && opp.done && opp.done.kind === 'solved') {
    toast('Not allowed: your friend already solved your word!');
    return;
  }

  let cost = typeof c.cost === 'number' ? c.cost : 0;
  let d = null;
  let needsOpp = false;
  let reqPayload = {};

  switch (f.id) {
    case 'first':
      d = { letter: oppWord[0] };
      break;
    case 'last':
      d = { letter: oppWord[oppWord.length - 1] };
      break;
    case 'len':
      d = { n: oppWord.length };
      break;
    case 'rel': {
      const w = wordOf(f.ids);
      const rel = w.length > oppWord.length ? 'longer' : w.length < oppWord.length ? 'shorter' : 'same';
      d = { word: w, rel: rel };
      break;
    }
    case 'strike': {
      const L = fl(f);
      d = { letter: L, yes: oppWord.indexOf(L) >= 0 };
      break;
    }
    case 'rare': {
      const L = f.letter;
      d = { letter: L, yes: oppWord.indexOf(L) >= 0 };
      break;
    }
    case 'cons': {
      let n = 0;
      for (let i = 0; i < oppWord.length; i++) if (!isVowelChar(oppWord[i])) n++;
      d = { n: n };
      break;
    }
    case 'vowc': {
      let n = 0;
      for (let i = 0; i < oppWord.length; i++) if (isVowelChar(oppWord[i])) n++;
      d = { n: n };
      break;
    }
    case 'burn': {
      const L = fl(f);
      let n = 0;
      for (let i = 0; i < oppWord.length; i++) if (oppWord[i] === L) n++;
      d = { letter: L, n: n };
      break;
    }
    case 'share': {
      const L = fl(f);
      let n = 0;
      for (let i = 0; i < oppWord.length; i++) if (oppWord[i] === L) n++;
      const mine = myCount(L);
      d = { letter: L, n: n, mine: mine };
      /* Send free mirrored intel to opponent */
      push(ref(db, 'rooms/' + S.room + '/intel/' + oppRole()), {
        id: 'share',
        d: { letter: L, n: mine, mine: n }
      }).catch(function () {});
      break;
    }
    case 'builder':
    case 'dyn': {
      const avail = {};
      for (let i = 0; i < oppWord.length; i++) avail[oppWord[i]] = (avail[oppWord[i]] || 0) + 1;
      let up = 0;
      const letters = f.ids.map(function (id) {
        const ch = S.tiles[id].ch;
        if (avail[ch] > 0) { avail[ch]--; up++; return { ch: ch, out: false }; }
        return { ch: ch, out: true };
      });
      if (c.dyn) cost = up;
      d = { word: wordOf(f.ids), letters: letters };
      break;
    }
    case 'super': {
      const L = fl(f);
      const posList = [];
      for (let i = 0; i < oppWord.length; i++) if (oppWord[i] === L) posList.push(i + 1);
      /* Always require human input so response timing never leaks copy count or hit/miss */
      needsOpp = true;
      reqPayload = { letter: L, positions: posList };
      break;
    }
    case 'vowel': {
      /* Always require human input so response timing never leaks remaining vowel count */
      needsOpp = true;
      reqPayload = {};
      break;
    }
    case 'give': {
      const myCh = myWord()[f.pick];
      if (S.myRev.indexOf(f.pick) < 0) S.myRev.push(f.pick);
      /* Share my revealed letter with opponent immediately */
      push(ref(db, 'rooms/' + S.room + '/intel/' + oppRole()), {
        id: 'give',
        d: { mine: '—', theirs: myCh }
      }).catch(function () {});
      /* Always require human input so response timing never leaks unrevealed tile count */
      needsOpp = true;
      reqPayload = { mine: myCh };
      break;
    }
    case 'rhyme': {
      needsOpp = true;
      reqPayload = {};
      break;
    }
  }

  /* Pay cost now */
  S.given += cost;
  ui.bump = true;

  if (!needsOpp) {
    S.log.push({ id: f.id, cost: cost, d: d });
    S.flow = null;
    ui.sheet = null;
    toast(sum({ id: f.id, d: d }) + ' (+' + cost + ')', true);
    syncMyStats();
    refresh();
  } else {
    /* Push interactive request to Firebase and wait */
    const reqRef = push(ref(db, 'rooms/' + S.room + '/reqs'));
    const reqId = reqRef.key;
    f.step = 'wait';
    f.reqId = reqId;
    f.paid = cost;
    await set(reqRef, {
      from: S.role,
      to: oppRole(),
      clueId: f.id,
      cost: cost,
      payload: reqPayload,
      status: 'pending',
      createdAt: Date.now()
    });
    syncMyStats();
    toast('Asked friend! Waiting for answer...');
    refresh();
  }
}

/* ---------- Deduction from the log ---------- */
function deduce(logArr) {
  const list = Array.isArray(logArr) ? logArr : S.log;
  const D = { len: null, lo: 1, hi: 11, vow: null, con: null, first: null, last: null, L: {}, pos: [], rhyme: [] };
  function g(ch) { return D.L[ch] || (D.L[ch] = { min: 0, max: null }); }
  function isIn(ch, n) { const s = g(ch); s.min = Math.max(s.min, n || 1); }
  function isOut(ch) { g(ch).max = 0; }
  function exact(ch, n) { const s = g(ch); s.min = n; s.max = n; }
  list.forEach(function (e) {
    const d = e.d || {};
    switch (e.id) {
      case 'first': D.first = d.letter; isIn(d.letter); break;
      case 'last': D.last = d.letter; isIn(d.letter); break;
      case 'len': D.len = d.n; break;
      case 'rel': { const n = d.word.length; if (d.rel === 'same') D.len = n; else if (d.rel === 'longer') D.hi = Math.min(D.hi, n - 1); else D.lo = Math.max(D.lo, n + 1); break; }
      case 'strike': case 'rare': if (d.yes) isIn(d.letter); else isOut(d.letter); break;
      case 'super': if (d.yes) { isIn(d.letter); if (d.pos) D.pos.push({ ch: d.letter, pos: d.pos }); } else isOut(d.letter); break;
      case 'vowel': if (d.letter) isIn(d.letter); break;
      case 'cons': D.con = d.n; break;
      case 'vowc': D.vow = d.n; break;
      case 'burn': case 'share': exact(d.letter, d.n); break;
      case 'give': if (d.theirs) isIn(d.theirs); break;
      case 'rhyme': D.rhyme.push(d.text); break;
      case 'builder': case 'dyn': {
        const m = {};
        d.letters.forEach(function (x) { const r = m[x.ch] || (m[x.ch] = { b: 0, u: 0 }); r.b++; if (!x.out) r.u++; });
        Object.keys(m).forEach(function (ch) { const r = m[ch]; if (r.u === 0) isOut(ch); else if (r.u < r.b) exact(ch, r.u); else isIn(ch, r.u); });
        break;
      }
    }
  });
  if (D.len == null && D.lo === D.hi) D.len = D.lo;
  if (D.len == null && D.vow != null && D.con != null) D.len = D.vow + D.con;
  if (D.len != null && D.vow != null && D.con == null) D.con = D.len - D.vow;
  if (D.len != null && D.con != null && D.vow == null) D.vow = D.len - D.con;
  return D;
}

function sum(e) {
  const d = e.d || {};
  switch (e.id) {
    case 'first': return 'First letter is ' + d.letter;
    case 'last': return 'Last letter is ' + d.letter;
    case 'len': return d.n + ' letters long';
    case 'rel': return d.word + ': ' + (d.rel === 'same' ? 'same length' : 'mine is ' + d.rel);
    case 'strike': case 'rare': return d.letter + ': ' + (d.yes ? 'in their word' : 'not in their word');
    case 'super': return d.letter + ': ' + (d.yes ? 'in, at position ' + d.pos : 'not in their word');
    case 'vowel': return d.letter ? d.letter + ' is in their word' : 'No unrevealed vowels left';
    case 'cons': return d.n + ' consonants';
    case 'vowc': return d.n + ' vowels';
    case 'burn': return d.letter + ' appears ' + d.n + (d.n === 1 ? ' time' : ' times');
    case 'share': return d.letter + ': you have ' + d.mine + ', they have ' + d.n;
    case 'give': return e.fromOpp ? ('Friend revealed ' + d.theirs) : ('You showed ' + d.mine + ', they showed ' + (d.theirs || 'none left'));
    case 'rhyme': return 'Rhymes with "' + d.text + '"';
    case 'builder': case 'dyn': return d.letters.map(function (x) { return x.ch + (x.out ? ' out' : ' in'); }).join(', ');
    case 'guess': return d.word + ': ' + (d.ok ? 'correct' : 'wrong');
  }
  return '';
}

/* ---------- Tile pool ---------- */
function defaultPool() {
  let v = 0, c = 0;
  return S.tiles.map(function (t) {
    if (t.v) { const a = Math.floor(v / 2) * COLS + (v % 2); v++; return a; }
    const b = Math.floor(c / 3) * COLS + 3 + (c % 3); c++; return b;
  });
}
function poolValid(p) {
  if (!Array.isArray(p) || p.length !== 11) return false;
  const seen = {};
  for (let i = 0; i < p.length; i++) { const n = p[i]; if (typeof n !== 'number' || n < 0 || n >= COLS * ROWS || n % 1 !== 0 || seen[n]) return false; seen[n] = 1; }
  return true;
}
function ensurePool() { if (S.tiles && S.tiles.length === 11 && !poolValid(S.pool)) S.pool = defaultPool(); }
function slotHTML(t, inner) {
  const cell = S.pool[t.id];
  return '<div class="slot" style="--c:' + (cell % COLS) + ';--r:' + Math.floor(cell / COLS) + '">' + inner + '</div>';
}
function poolHTML(hidden, o) {
  const h = S.tiles.filter(function (t) { return hidden.indexOf(t.id) < 0; }).map(function (t) {
    return slotHTML(t, tileBtn(t, { off: o.allowed && !o.allowed(t), deal: o.deal, i: t.id }));
  }).join('');
  return '<div class="pool" data-drop="pool">' + h + '</div>';
}
function intelTile(t, s) {
  let cls = '', b = '';
  if (s) {
    if (s.max === 0) { cls = ' out'; b = 'OUT'; }
    else if (s.min >= 1) { cls = ' in'; b = (s.max != null && s.max === s.min) ? 'x' + s.min : (s.min > 1 ? '>=' + s.min : 'IN'); }
  }
  return slotHTML(t, '<button type="button" class="tile ' + (t.v ? 'vow' : 'con') + cls + '" data-bt="' + t.id + '" aria-label="Tile ' + t.ch + (b ? ', ' + b : '') + '">' + t.ch + (b ? '<span class="bdg">' + b + '</span>' : '') + '</button>');
}
function intelPoolHTML(D) {
  return '<div class="builder" data-builder="intel" data-mode="pool"><div class="pool" data-drop="pool">' + S.tiles.map(function (t) { return intelTile(t, D.L[t.ch]); }).join('') + '</div></div>';
}

function tileBtn(t, o) {
  o = o || {};
  return '<button type="button" class="tile ' + (t.v ? 'vow' : 'con') + (o.off ? ' off' : '') + (o.deal ? ' deal' : '') + '" data-bt="' + t.id + '"' + (o.off ? ' disabled' : '') + ' aria-label="Tile ' + t.ch + '"' + (o.i != null ? ' style="--i:' + o.i + '"' : '') + '>' + t.ch + '</button>';
}
function builderHTML(ctx, ids, o) {
  const slot = ids.length ? ids.map(function (id) { return tileBtn(S.tiles[id]); }).join('') : '<span class="empty">' + (o.mode === 'single' ? 'Drop a tile here' : 'Drop tiles here to spell a word') + '</span>';
  return '<div class="builder" data-builder="' + ctx + '" data-mode="' + o.mode + '"><div class="wordrow" data-drop="row">' + slot + '</div>' + poolHTML(ids, o) + '</div>';
}

function logHTML(logArr, emptyMsg) {
  const list = Array.isArray(logArr) ? logArr : S.log;
  if (!list.length) return '<p class="empty-note">' + esc(emptyMsg || 'Nothing asked yet. Pick a clue card.') + '</p>';
  return '<ul class="log">' + list.slice().reverse().map(function (e) {
    const name = e.id === 'guess' ? 'Guess' : (e.fromOpp ? 'Friend: ' : '') + CL[e.id].name;
    return '<li><span class="lc' + (e.cost ? '' : ' z') + '">' + (e.cost ? '+' + e.cost : '0') + '</span><div><b>' + esc(name) + '</b><span class="t">' + esc(sum(e)) + '</span></div></li>';
  }).join('') + '</ul>';
}

function viewDone() {
  let clueCost = 0; S.log.forEach(function (e) { if (e.id !== 'guess') clueCost += e.cost; });
  const forfeit = S.done && S.done.kind === 'forfeit';
  const opp = S.online ? oppPlayer() : null;
  const oppDone = !!(opp && opp.done);
  const oppForfeit = !!(oppDone && opp.done.kind === 'forfeit');

  let stampTxt = forfeit ? 'FORFEIT' : 'SOLVED';
  let stampBad = forfeit;
  if (S.online && oppDone) {
    if (forfeit && !oppForfeit) { stampTxt = 'FRIEND WINS'; stampBad = true; }
    else if (!forfeit && oppForfeit) { stampTxt = 'YOU WIN!'; stampBad = false; }
    else if (!forfeit && !oppForfeit) {
      const oppGiven = opp.given || 0;
      if (S.given < oppGiven) { stampTxt = 'YOU WIN!'; stampBad = false; }
      else if (S.given > oppGiven) { stampTxt = 'FRIEND WINS'; stampBad = true; }
      else { stampTxt = 'TIE GAME!'; stampBad = false; }
    }
  }

  let h = '<div class="top"><span class="mini">SEEDED WORDY</span><span class="sub">' + (S.online ? 'Room ' : 'Seed ') + '<b>' + esc(S.online ? S.room : (S.seed + modeTag())) + '</b></span></div>';

  /* Even on done screen, opponent might still ask an interactive clue while finishing! */
  if (S.online) {
    const pend = getPendingReqsForMe();
    if (pend.length) {
      const r0 = pend[0];
      h += '<button type="button" class="btn gold wide pulse-btn" data-act="openreq" data-id="' + esc(r0._k) + '">Answer Friend: ' + esc(CL[r0.clueId].name) + '</button>';
    }
  }

  h += '<div class="stamp' + (stampBad ? ' f' : '') + '">' + stampTxt + '</div>';

  if (S.online) {
    h += '<div class="final-grid">' +
      '<div class="panel final"><div class="lbl" style="margin:0">You gave</div><div class="big-n">' + S.given + '</div></div>' +
      '<div class="panel final"><div class="lbl" style="margin:0">Friend gave</div><div class="big-n" style="color:var(--blue)">' + (opp ? (opp.given || 0) : '?') + '</div><small class="sub">' + (oppDone ? (oppForfeit ? 'Forfeited' : 'Solved') : 'Still playing...') + '</small></div>' +
    '</div>';
  } else {
    h += '<div class="panel final"><div class="lbl" style="margin:0">Berries you gave</div><div class="big-n">' + S.given + '</div></div>';
  }

  h += '<div class="panel"><div class="kv"><span>Clue berries</span><b>' + clueCost + '</b></div><div class="kv"><span>Wrong guesses (' + S.wrong + ' x 2)</span><b>' + (S.wrong * 2) + '</b></div><div class="kv"><span>Your word</span><b>' + esc(wordOf(S.word, myTileSet())) + '</b></div>' +
    (S.online && opp && opp.wordStr ? '<div class="kv"><span>Friend\'s word</span><b>' + esc(opp.wordStr) + '</b></div>' : '') +
  '</div>';

  if (forfeit) h += '<div class="panel"><p>You forfeited, so your friend wins this round.</p></div>';
  else if (S.online && !oppDone) h += '<div class="panel"><div class="lbl">Waiting for friend</div><p>Your friend is still solving your word! Stay on this screen in case they play a clue like Rhyme Time. Fewer berries given wins.</p></div>';
  else if (!S.online) h += '<div class="panel"><div class="lbl">Compare</div><p>When your friend finishes, compare totals. The player who gave <b>fewer</b> berries wins. Tied? First to spell a new valid 4-letter word from the tiles wins.</p><p class="sub" style="margin-top:8px">Your friend can no longer use Let\'s Share or Give and Take on you.</p></div>';

  h += '<div class="panel"><div class="lbl">Notebook</div>' + logHTML() + '</div>';
  h += '<button type="button" class="btn red wide" data-act="newgame">New game</button>';
  if (ui.confirm === 'new') h += '<div class="panel"><p>Leave this game and start over?</p><div class="row" style="margin-top:12px"><button type="button" class="btn grey" data-act="cancelconfirm">Keep it</button><button type="button" class="btn red" data-act="newok">Start Over</button></div></div>';
  return h;
}

function render() {
  const y = window.scrollY;
  const v = S.stage === 'seed' ? viewSeed()
    : S.stage === 'build' ? viewBuild()
    : S.stage === 'wait' ? viewWait()
    : S.stage === 'play' ? viewPlay()
    : viewDone();
  const app = $('#app');
  app.className = 'wrap' + (ui.enter ? ' enter' : '');
  app.innerHTML = v;
  ui.enter = false; ui.bump = false;
  window.scrollTo(0, y);
}

/* ---------- Sheet views ---------- */
function chip(on, act, data, label, cls) {
  let attrs = ''; for (const k in data) attrs += ' data-' + k + '="' + esc(data[k]) + '"';
  return '<button type="button" class="chip' + (on ? ' on' : '') + (cls ? ' ' + cls : '') + '" data-act="' + act + '"' + attrs + '>' + label + '</button>';
}
function numGrid(act, lo, hi, cur) {
  let out = '';
  for (let n = lo; n <= hi; n++) out += chip(cur === n, act, { v: n }, n);
  return '<div class="grid">' + out + '</div>';
}
function builderOpts(f) {
  if (f.type === 'guess') return { mode: 'word' };
  const c = CL[f.id];
  if (c.inp === 'word') return { mode: 'word' };
  if (c.inp === 'repeat') { const cnt = letterCounts(); return { mode: 'single', allowed: function (t) { return cnt[t.ch] > 1; } }; }
  return { mode: 'single' };
}
function canAsk(f) {
  const c = CL[f.id];
  switch (c.inp) {
    case 'none': return true;
    case 'letter': return f.ids.length === 1;
    case 'repeat': return f.ids.length === 1;
    case 'word': return f.ids.length >= 1;
    case 'rare': return !!f.letter;
    case 'mine': return f.pick != null;
  }
  return false;
}
function answered(f) {
  const a = f.a, c = CL[f.id];
  switch (c.ans) {
    case 'letter': return !!a.letter;
    case 'vowel': return a.letter !== undefined;
    case 'num': return a.n != null;
    case 'rel': return !!a.rel;
    case 'yn': return a.yn != null;
    case 'ynpos': return a.yn === 0 || (a.yn === 1 && !!a.pos);
    case 'flip': return true;
    case 'text': return !!(a.text || '').trim();
  }
  return false;
}
function unflipped(f) { let n = 0; f.ids.forEach(function (id, i) { if (!f.a.fl[i]) n++; }); return n; }

function ansUI(f) {
  const c = CL[f.id], a = f.a;
  let h = '<div><div class="lbl">Their answer</div>';
  switch (c.ans) {
    case 'letter':
      h += '<div class="grid">' + uniqLetters().map(function (L) { return chip(a.letter === L, 'a-letter', { v: L }, L); }).join('') + '</div>'; break;
    case 'vowel':
      h += '<div class="grid">' + vowelLetters().map(function (L) { return chip(a.letter === L, 'a-letter', { v: L }, L); }).join('') + '</div>';
      h += '<div style="margin-top:8px">' + chip(a.letter === null, 'a-none', {}, 'None left', 'sm') + '</div>'; break;
    case 'num': h += numGrid('a-num', c.lo, 11, a.n); break;
    case 'rel':
      h += '<div class="grid g3">' + chip(a.rel === 'longer', 'a-rel', { v: 'longer' }, 'Mine is longer', 'sm') + chip(a.rel === 'same', 'a-rel', { v: 'same' }, 'Same length', 'sm') + chip(a.rel === 'shorter', 'a-rel', { v: 'shorter' }, 'Mine is shorter', 'sm') + '</div>'; break;
    case 'yn':
      h += '<div class="grid g2">' + chip(a.yn === 1, 'a-yn', { v: 1 }, 'Yes') + chip(a.yn === 0, 'a-yn', { v: 0 }, 'No') + '</div>'; break;
    case 'ynpos':
      h += '<div class="grid g2">' + chip(a.yn === 1, 'a-yn', { v: 1 }, 'Yes') + chip(a.yn === 0, 'a-yn', { v: 0 }, 'No') + '</div>';
      if (a.yn === 1) h += '<div class="lbl" style="margin-top:14px">Position of one copy</div>' + numGrid('a-pos', 1, 11, a.pos); break;
    case 'flip':
      h += '<p class="sub" style="margin-bottom:10px">Tap each tile your friend flipped face-down.</p><div class="flips">' + f.ids.map(function (id, i) {
        const t = S.tiles[id], off = a.fl[i];
        return '<button type="button" class="tile ' + (t.v ? 'vow' : 'con') + (off ? ' flipped' : '') + '" data-act="a-flip" data-i="' + i + '" aria-pressed="' + (off ? 'true' : 'false') + '" aria-label="' + t.ch + (off ? ' flipped' : ' face-up') + '">' + (off ? '' : t.ch) + '</button>';
      }).join('') + '</div>';
      if (c.dyn) h += '<p class="costline" style="margin-top:12px">Cost: ' + unflipped(f) + ' face-up</p>'; break;
    case 'text':
      h += '<input class="txt" id="rhymeIn" type="text" maxlength="30" placeholder="Their rhyming word" value="' + esc(a.text || '') + '" autocomplete="off" autocapitalize="off">'; break;
  }
  return h + '</div>';
}

function inputUI(f) {
  const c = CL[f.id];
  let h = '';
  if (c.inp === 'letter' || c.inp === 'repeat' || c.inp === 'word') {
    const o = builderOpts(f);
    if (c.inp === 'repeat' && !repeatLetters().length) return '<div class="warn">No letter repeats in your 11 tiles, so this card can not be used this round.</div>';
    h += '<div><div class="lbl">' + (c.inp === 'word' ? 'Build a word' : 'Pick a tile') + '</div>' + builderHTML('flow', f.ids, o) + '</div>';
  } else if (c.inp === 'rare') {
    h += '<div><div class="lbl">Pick a letter</div><div class="grid" style="grid-template-columns:repeat(5,1fr)">' + RARE.map(function (L) { return chip(f.letter === L, 'rare', { v: L }, L); }).join('') + '</div></div>';
  } else if (c.inp === 'mine') {
    const mts = myTileSet();
    const opts = S.word.map(function (id, i) { return { i: i, t: mts[id] }; }).filter(function (x) { return S.myRev.indexOf(x.i) < 0; });
    if (!opts.length) return '<div class="warn">Every tile of your word has already been revealed.</div>';
    h += '<div><div class="lbl">Which of your tiles do you reveal?</div><div class="flips">' + opts.map(function (x) { return '<button type="button" class="tile ' + (x.t.v ? 'vow' : 'con') + (f.pick === x.i ? ' on' : '') + '" data-act="pick" data-i="' + x.i + '" aria-label="Reveal ' + x.t.ch + '">' + x.t.ch + '</button>'; }).join('') + '</div></div>';
  }
  return h;
}

function poolCardRow(id) {
  const c = CL[id], on = getDisabled().indexOf(id) < 0;
  return '<button type="button" class="pcard ' + c.k + (on ? ' on' : ' off') + '" data-act="togglecard" data-id="' + id + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
    '<span class="pcost">' + c.cost + '</span>' +
    '<span class="pinfo"><b>' + esc(c.name) + ' <small style="display:inline;opacity:.75">(' + esc(c.bird) + ')</small></b><small>' + esc(c.s) + '</small></span>' +
    '<span class="pchk">' + (on ? 'ON' : 'OFF') + '</span>' +
  '</button>';
}

function sheetView() {
  let t = '', sub = '', body = '', foot = '';
  if (ui.sheet === 'flow') {
    const f = S.flow;
    if (f.type === 'guess') {
      t = 'Guess their word';
      if (f.step === 'in') {
        body = '<p class="rule">Spell your guess with the tiles. A wrong guess gives your friend 2 berries.</p><div><div class="lbl">Your guess</div>' + builderHTML('flow', f.ids, { mode: 'word' }) + '</div>';
        foot = '<button type="button" class="btn grey" data-act="close">Cancel</button><button type="button" class="btn big" data-act="gask"' + (f.ids.length ? '' : ' disabled') + '>Guess</button>';
      } else {
        body = '<div class="say"><div class="lbl">Say this to your friend</div>Is your word <b>' + esc(wordOf(f.ids)) + '</b>?</div><div><div class="lbl">Their answer</div><div class="grid g2"><button type="button" class="btn red" data-act="gbad">Wrong +2</button><button type="button" class="btn green" data-act="gok">Correct</button></div></div>';
        foot = '<button type="button" class="btn grey" data-act="gedit">Edit guess</button>';
      }
    } else {
      const c = CL[f.id];
      t = c.name;
      sub = '<div class="kindrow" style="margin-top:6px"><span class="tagx ' + c.k + '">' + (c.k === 'v' ? 'Vanilla' : 'Spicy') + '</span><span class="costline">' + (c.dyn ? 'Costs 1 per tile left face-up' : 'Costs ' + c.cost + (c.cost === 1 ? ' berry' : ' berries')) + '</span></div>';
      if (f.step === 'in') {
        body = '<p class="rule">' + esc(c.full) + '</p>' + inputUI(f);
        const blocked = c.inp === 'repeat' && !repeatLetters().length;
        foot = '<button type="button" class="btn grey" data-act="close">Cancel</button><button type="button" class="btn big" data-act="ask"' + (canAsk(f) && !blocked ? '' : ' disabled') + '>Ask</button>';
      } else if (f.step === 'wait') {
        body = '<div class="say"><div class="lbl">Sent to friend!</div>Waiting for your friend to respond to <b>' + esc(c.name) + '</b>. You can close this sheet and keep studying the board—their answer will log automatically!</div>';
        foot = '<button type="button" class="btn grey wide" data-act="close">Close &amp; Wait</button>';
      } else {
        body = '<div class="say"><div class="lbl">Say this to your friend</div>' + esc(c.q(f)) + '</div>';
        if (f.id === 'share') body += '<p class="rule">Your count of ' + fl(f) + ': <b>' + myCount(fl(f)) + '</b></p>';
        body += ansUI(f);
        foot = '<button type="button" class="btn grey" data-act="undo">Undo ask</button><button type="button" class="btn big" id="logBtn" data-act="logit"' + (answered(f) ? '' : ' disabled') + '>Log answer</button>';
      }
    }
  } else if (ui.sheet === 'ansreq') {
    const req = getPendingReqsForMe().find(function (r) { return r._k === ui.reqId; });
    if (req) {
      const c = CL[req.clueId];
      const mts = myTileSet();
      t = 'Friend asks: ' + c.name;
      sub = '<p class="sub">Your secret word: <b>' + esc(wordOf(S.word, mts)) + '</b></p>';
      let canSend = false;

      if (req.clueId === 'rhyme') {
        body = '<p class="rule">Type a valid word that rhymes with your secret word (<b>' + esc(wordOf(S.word, mts)) + '</b>). If nothing rhymes, make one up.</p>' +
          '<input class="txt" id="reqRhymeIn" type="text" maxlength="30" placeholder="Your rhyming word..." value="' + esc(ui.reqAns.text || '') + '" autocomplete="off" autocapitalize="off">';
        canSend = !!(ui.reqAns.text || '').trim();
      } else if (req.clueId === 'super') {
        const L = req.payload.letter;
        const posList = req.payload.positions || [];
        if (posList.length === 0) {
          body = '<p class="rule">Your friend used Super Strike on <b>' + esc(L) + '</b>. Your word does not contain <b>' + esc(L) + '</b>.</p>';
          canSend = true;
        } else {
          const picked = ui.reqAns.pos || (posList.length === 1 ? posList[0] : null);
          body = '<p class="rule">Your friend used Super Strike on <b>' + esc(L) + '</b>. ' + (posList.length === 1 ? 'Confirm the position to reveal:' : 'You have multiple copies—pick which position to reveal:') + '</p>' +
            '<div class="grid g3">' + posList.map(function (p) { return chip(picked === p, 'req-pos', { v: p }, 'Pos ' + p, 'sm'); }).join('') + '</div>';
          canSend = !!picked;
        }
      } else if (req.clueId === 'vowel' || req.clueId === 'give') {
        const onlyVow = req.clueId === 'vowel';
        const opts = S.word.map(function (id, i) { return { i: i, t: mts[id] }; }).filter(function (x) {
          return S.myRev.indexOf(x.i) < 0 && (!onlyVow || x.t.v);
        });
        if (!opts.length) {
          body = '<p class="rule">' + (onlyVow ? 'Your friend played Buy a Vowel, but you have no unrevealed vowels left.' : 'Your friend revealed a <b>' + esc(req.payload.mine) + '</b>, but all tiles in your word are already revealed.') + '</p>';
          canSend = true;
        } else {
          body = '<p class="rule">' + (onlyVow ? 'Pick one unrevealed vowel from your word to show your friend:' : 'Your friend revealed a <b>' + esc(req.payload.mine) + '</b>. Pick one unrevealed tile from your word to show them:') + '</p>' +
            '<div class="flips">' + opts.map(function (x) {
              return '<button type="button" class="tile ' + (x.t.v ? 'vow' : 'con') + (ui.reqAns.idx === x.i ? ' on' : '') + '" data-act="req-tile" data-i="' + x.i + '">' + x.t.ch + '</button>';
            }).join('') + '</div>';
          canSend = ui.reqAns.idx != null;
        }
      }
      foot = '<button type="button" class="btn grey" data-act="close">Later</button><button type="button" class="btn green big" id="sendReqBtn" data-act="sendreq"' + (canSend ? '' : ' disabled') + '>Send Answer</button>';
    }
  } else if (ui.sheet === 'opp') {
    const opp = oppPlayer() || {};
    const oppLog = Array.isArray(opp.log) ? opp.log : [];
    const OD = deduce(oppLog);
    const lenTxt = OD.len != null ? OD.len : ((OD.lo > 1 || OD.hi < 11) ? OD.lo + '-' + OD.hi : null);
    function opill(k, v) { return '<div class="pill"><span>' + k + '</span><b' + (v == null ? ' class="q"' : '') + '>' + (v == null ? '?' : v) + '</b></div>'; }
    const knownIn = Object.keys(OD.L).filter(function (ch) { return OD.L[ch].min >= 1; }).sort();
    const knownOut = Object.keys(OD.L).filter(function (ch) { return OD.L[ch].max === 0; }).sort();
    t = 'Friend Status & Intel';
    sub = '<p class="sub">' + (opp.done ? (opp.done.kind === 'solved' ? 'Status: Solved your word!' : 'Status: Forfeited') : 'Status: Currently guessing your word') + '</p>';
    body = '<div class="score">' +
      '<div class="sbox r"><div class="k">Berries given</div><div class="n">' + (opp.given || 0) + '</div></div>' +
      '<div class="sbox b"><div class="k">Clues</div><div class="n">' + (opp.clues || 0) + '</div></div>' +
      '<div class="sbox g"><div class="k">Misses</div><div class="n">' + (opp.wrong || 0) + '</div></div>' +
    '</div>';
    body += '<div><div class="lbl">What they know about your word</div><div class="pills">' +
      opill('LEN', lenTxt) + opill('VOW', OD.vow) + opill('CON', OD.con) + opill('1ST', OD.first) + opill('LST', OD.last) +
    '</div>';
    if (knownIn.length) body += '<div class="note">Confirmed IN: <b>' + knownIn.join(', ') + '</b></div>';
    if (knownOut.length) body += '<div class="note">Confirmed OUT: <b>' + knownOut.join(', ') + '</b></div>';
    if (OD.pos.length) body += '<div class="note">Positions known: ' + OD.pos.map(function (p) { return '<b>' + p.ch + '</b> at ' + p.pos; }).join(', ') + '</div>';
    if (OD.rhyme.length) body += '<div class="note">Rhymes given: <b>' + OD.rhyme.map(esc).join(', ') + '</b></div>';
    body += '</div>';
    body += '<div><div class="lbl">Their Clues &amp; Guesses (' + oppLog.length + ')</div>' + logHTML(oppLog, 'Your friend has not asked any clues yet.') + '</div>';
    foot = '<button type="button" class="btn grey wide" data-act="close">Close</button>';
  } else if (ui.sheet === 'dict') {
    t = 'Dictionary Check';
    sub = '<p class="sub">' + (dictState === 'ready' ? 'Loaded Words.txt (' + dict.size.toLocaleString() + ' words).' : dictState === 'loading' ? 'Loading Words.txt...' : 'Words.txt could not be loaded.') + '</p>';
    body = '<p class="rule">Type any word to verify if it is accepted in Words.txt.</p>' +
      '<input class="txt" id="dictIn" type="text" maxlength="24" placeholder="Type a word..." value="' + esc(ui.dictQ || '') + '" autocomplete="off" autocapitalize="off" spellcheck="false">';
    if (ui.dictRes) {
      body += ui.dictRes.ok
        ? '<div class="okbox"><b>' + esc(ui.dictRes.word) + '</b> is a valid word!</div>'
        : '<div class="warn"><b>' + esc(ui.dictRes.word) + '</b> is not in Words.txt.</div>';
    }
    foot = '<button type="button" class="btn grey" data-act="close">Close</button><button type="button" class="btn big" data-act="checkdict">Check Word</button>';
  } else if (ui.sheet === 'word') {
    t = 'My word'; sub = '<p class="sub">Tap Show to see it. Tap a tile while it is showing to mark it as revealed to your friend.</p>';
    const shown = ui.peek, mts = myTileSet();
    body = '<div class="peek">' + S.word.map(function (id, i) {
      const tl = mts[id], rev = S.myRev.indexOf(i) >= 0, face = shown || rev;
      return '<button type="button" class="tile ' + (tl.v ? 'vow' : 'con') + (face ? '' : ' flipped') + '" data-act="rev" data-i="' + i + '" aria-label="' + (face ? tl.ch : 'Hidden tile') + '">' + (face ? tl.ch : '') + (rev ? '<span class="revmark">SHOWN</span>' : '') + '</button>';
    }).join('') + '</div>';
    body += '<p class="sub">' + S.word.length + ' letters. ' + S.myRev.length + ' revealed so far.</p>';
    foot = '<button type="button" class="btn grey" data-act="close">Close</button><button type="button" class="btn big gold" data-act="peek">' + (shown ? 'Hide' : 'Show') + '</button>';
  } else if (ui.sheet === 'pool') {
    const vc = enabledVan().length, sc = enabledSpi().length;
    t = 'Card Pool Settings';
    sub = '<p class="sub">Toggle which cards can be dealt. Up to 4 Vanilla and 4 Spicy cards are dealt each game.</p>';
    if (vc < 4 || sc < 4) {
      body += '<div class="warn">Fewer than 4 ' + (vc < 4 && sc < 4 ? 'Vanilla &amp; Spicy' : vc < 4 ? 'Vanilla' : 'Spicy') + ' cards enabled (' + vc + 'V / ' + sc + 'S) — fewer cards will be dealt in your hand.</div>';
    }
    body += '<div><div class="lbl">Vanilla Clues (' + vc + ' / ' + VAN.length + ' on)</div><div class="pool-list">' + VAN.map(poolCardRow).join('') + '</div></div>';
    body += '<div><div class="lbl">Spicy Clues (' + sc + ' / ' + SPI.length + ' on)</div><div class="pool-list">' + SPI.map(poolCardRow).join('') + '</div></div>';
    foot = '<button type="button" class="btn grey" data-act="poolall">Reset All On</button><button type="button" class="btn big" data-act="close">Done</button>';
  } else if (ui.sheet === 'menu') {
    t = 'Game menu';
    const disN = getDisabled().length;
    body = '<div class="kv"><span>' + (S.online ? 'Room Code' : 'Seed') + '</span><b>' + esc(S.online ? S.room : S.seed) + '</b></div>' +
           '<div class="kv"><span>Mode</span><b>' + esc(S.online ? ('Online · ' + (S.role === 'p1' ? 'Host' : 'Guest') + ' · ' + (S.mpMode === 'A' ? 'Asymmetric' : 'Shared')) : (S.mode || 'S')) + '</b></div>' +

function toast(msg, ok) {

  const box = $('#toastbox'); box.innerHTML = ''; box.appendChild(el);

function copyText(text, okMsg) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if (ok) { toast(okMsg, true); return; }
  } catch (e) {}
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { toast(okMsg, true); }, function () { toast('Copy failed. Select it manually.'); });
  } else {
    toast('Copy failed. Select it manually.');
  }
}

/* ---------- Flow actions ---------- */
function openClue(id) { S.flow = { type: 'clue', id: id, step: 'in', ids: [], letter: null, pick: null, paid: 0, a: {} }; ui.sheet = 'flow'; }
function finishClue() {
  const f = S.flow, c = CL[f.id], a = f.a;
  let d = {}, cost = f.paid || 0;
  switch (f.id) {
    case 'first': case 'last': d = { letter: a.letter }; break;
    case 'len': case 'cons': case 'vowc': d = { n: a.n }; break;
    case 'rel': d = { word: wordOf(f.ids), rel: a.rel }; break;
    case 'strike': d = { letter: fl(f), yes: a.yn === 1 }; break;
    case 'rare': d = { letter: f.letter, yes: a.yn === 1 }; break;
    case 'super': d = { letter: fl(f), yes: a.yn === 1, pos: a.yn === 1 ? a.pos : null }; break;
    case 'vowel': d = { letter: a.letter }; break;
    case 'burn': d = { letter: fl(f), n: a.n }; break;
    case 'share': d = { letter: fl(f), n: a.n, mine: myCount(fl(f)) }; break;
    case 'give': d = { mine: myWord()[f.pick], theirs: a.letter }; S.myRev.push(f.pick); break;
    case 'rhyme': d = { text: (a.text || '').trim() }; break;
    case 'builder': case 'dyn': d = { word: wordOf(f.ids), letters: f.ids.map(function (id, i) { return { ch: S.tiles[id].ch, out: !!a.fl[i] }; }) }; break;
  }
  if (c.dyn) { cost = unflipped(f); S.given += cost; }
  S.log.push({ id: f.id, cost: cost, d: d });
  ui.bump = true; S.flow = null; ui.sheet = null;
  toast('+' + cost + ' berries given');
}
function finishGuess(ok) {
  const f = S.flow;
  S.log.push({ id: 'guess', cost: ok ? 0 : 2, d: { word: wordOf(f.ids), ok: ok } });
  if (ok) { S.stage = 'done'; S.done = { kind: 'solved' }; toast('Solved!', true); }
  else { S.given += 2; S.wrong++; ui.bump = true; toast('Wrong guess! +2 berries given'); }
  S.flow = null; ui.sheet = null;
  syncMyStats();
}

const ADJ = ['maple', 'cobalt', 'quiet', 'brisk', 'amber', 'lucky', 'mossy', 'silver', 'tiny', 'windy'];
const NOUN = ['finch', 'wren', 'robin', 'heron', 'lark', 'plover', 'swift', 'jay', 'owl', 'kite'];
function randomSeed() {
  return ADJ[Math.floor(Math.random() * ADJ.length)] + '-' + NOUN[Math.floor(Math.random() * NOUN.length)] + '-' + (10 + Math.floor(Math.random() * 90));
}

/* ---------- Tile pool and word line: tap and drag ---------- */
function getIds(ctx) { return ctx === 'draft' ? S.draft : (S.flow ? S.flow.ids : []); }
function setIds(ctx, ids) { if (ctx === 'draft') S.draft = ids; else if (S.flow) S.flow.ids = ids; refresh(); }
function movePool(id, cell) {
  const occ = S.pool.indexOf(cell);
  if (occ >= 0 && occ !== id) S.pool[occ] = S.pool[id];
  S.pool[id] = cell;
}
function tapTile(ctx, id, mode) {
  if (mode === 'pool') return;
  let ids = getIds(ctx).slice();
  if (ids.indexOf(id) >= 0) ids = ids.filter(function (i) { return i !== id; });
  else if (mode === 'single') ids = [id]; else ids.push(id);
  setIds(ctx, ids);
}
function dropIndex(row, id, x, y) {
  const els = Array.prototype.filter.call(row.querySelectorAll('[data-bt]'), function (e) { return +e.dataset.bt !== id; });
  if (!els.length) return 0;
  let best = 0, bd = 1e9, after = false;
  els.forEach(function (e, i) {
    const r = e.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, dd = Math.hypot(x - cx, (y - cy) * 1.5);
    if (dd < bd) { bd = dd; best = i; after = x > cx; }
  });
  return best + (after ? 1 : 0);
}
function regionAt(b, x, y) {
  const row = b.querySelector('.wordrow'), pool = b.querySelector('.pool');
  function box(el, pad) {
    if (!el) return null;
    const r = el.getBoundingClientRect();
    return (x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad) ? r : null;
  }
  if (box(row, 6)) return { zone: 'row', el: row };
  const pr = box(pool, 14);
  if (pr) {
    const col = Math.max(0, Math.min(COLS - 1, Math.floor((x - pr.left) / (pr.width / COLS))));
    const rw = Math.max(0, Math.min(ROWS - 1, Math.floor((y - pr.top) / (pr.height / ROWS))));
    return { zone: 'pool', el: pool, cell: rw * COLS + col };
  }
  return null;
}
function doDrop(d, x, y) {
  const b = d.el.closest('[data-builder]'); if (!b) return;
  const reg = regionAt(b, x, y); if (!reg) return;
  const mode = b.dataset.mode;
  if (reg.zone === 'pool') {
    movePool(d.id, reg.cell);
    if (mode === 'pool') { refresh(); return; }
    setIds(d.ctx, getIds(d.ctx).filter(function (i) { return i !== d.id; }));
    return;
  }
  if (mode === 'pool') return;
  let ids = getIds(d.ctx).slice();
  if (mode === 'single') ids = [d.id];
  else { const idx = dropIndex(reg.el, d.id, x, y); ids = ids.filter(function (i) { return i !== d.id; }); ids.splice(idx, 0, d.id); }
  setIds(d.ctx, ids);
}

let drag = null;
document.addEventListener('pointerdown', function (e) {
  const t = e.target.closest ? e.target.closest('.tile[data-bt]') : null;
  if (!t || t.disabled) return;
  const b = t.closest('[data-builder]'); if (!b) return;
  drag = { id: +t.dataset.bt, ctx: b.dataset.builder, mode: b.dataset.mode, el: t, sx: e.clientX, sy: e.clientY, moved: false, ghost: null, pid: e.pointerId };
});
window.addEventListener('pointermove', function (e) {
  if (!drag || e.pointerId !== drag.pid) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 8) {
    drag.moved = true;
    const g = drag.el.cloneNode(true); g.classList.add('fly'); g.removeAttribute('data-bt'); document.body.appendChild(g); drag.ghost = g;
    drag.el.classList.add('dragging');
  }
  if (drag.moved) {
    drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
    document.querySelectorAll('.hot').forEach(function (n) { n.classList.remove('hot'); });
    const bb = drag.el.closest('[data-builder]'), rg = bb ? regionAt(bb, e.clientX, e.clientY) : null;
    if (rg) rg.el.classList.add('hot');
    e.preventDefault();
  }
}, { passive: false });
function endDrag(e, cancel) {
  if (!drag || e.pointerId !== drag.pid) return;
  const d = drag; drag = null;
  document.querySelectorAll('.hot').forEach(function (n) { n.classList.remove('hot'); });
  if (d.ghost && d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
  if (d.moved) { d.el.classList.remove('dragging'); if (!cancel) doDrop(d, e.clientX, e.clientY); }
  else if (!cancel) tapTile(d.ctx, d.id, d.mode);
}
window.addEventListener('pointerup', function (e) { endDrag(e, false); });
window.addEventListener('pointercancel', function (e) { endDrag(e, true); });
document.addEventListener('contextmenu', function (e) { if (e.target.closest && e.target.closest('.tile')) e.preventDefault(); });

    case 'ask':
      if (!f || !canAsk(f)) return;
      if (CL[f.id].inp === 'word' && !checkWord(wordOf(f.ids))) return;
      if (S.online) {
        await executeOnlineClue(f);

      }
      f.step = 'ans'; f.a = { fl: f.ids.map(function () { return false; }) };
      if (typeof CL[f.id].cost === 'number') { f.paid = CL[f.id].cost; S.given += f.paid; ui.bump = true; }
      break;
    case 'undo': S.given -= f.paid; f.paid = 0; f.step = 'in'; f.a = {}; break;

    case 'logit': if (answered(f)) finishClue(); break;
    case 'a-letter': f.a.letter = v; break;
    case 'a-none': f.a.letter = null; break;
    case 'a-num': f.a.n = +v; break;
    case 'a-rel': f.a.rel = v; break;
    case 'a-yn': f.a.yn = +v; if (+v === 0) f.a.pos = null; break;
    case 'a-pos': f.a.pos = +v; break;
    case 'a-flip': f.a.fl[+i] = !f.a.fl[+i]; break;
    case 'rare': f.letter = v; break;

      ui.peek = !ui.peek; clearTimeout(peekTimer);

      break;
    case 'rev':
      if (ui.peek) {
        const k = S.myRev.indexOf(+i); if (k >= 0) S.myRev.splice(k, 1); else S.myRev.push(+i);
        clearTimeout(peekTimer); peekTimer = setTimeout(function () { ui.peek = false; renderSheet(); }, 8000);
        syncMyStats();
      }
      break;
    case 'menu': ui.sheet = 'menu'; ui.confirm = null; break;
    case 'copyseed':
      copyText(S.online ? S.room : S.seed, S.online ? 'Room code copied!' : 'Seed copied!');
      return;
    case 'forfeit': ui.confirm = 'forfeit'; break;
    case 'forfeitok':
      S.stage = 'done'; S.done = { kind: 'forfeit' }; S.flow = null; ui.sheet = null; ui.confirm = null;

      break;
    default: return;
  }
  refresh();
});

  }
  if (e.target && e.target.id === 'reqRhymeIn') {
    ui.reqAns.text = e.target.value;
    const b = $('#sendReqBtn'); if (b) b.disabled = !ui.reqAns.text.trim();
  }
  if (e.target && e.target.id === 'dictIn') {
    ui.dictQ = e.target.value;
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && ui.sheet) { const c = $('[data-act="close"]'); if (c) c.click(); }
  if (e.key === 'Enter' && e.target && e.target.id === 'seedIn') {
    const btn = document.querySelector('[data-act="hostroom"], [data-act="joinroom"], [data-act="deal"]');
    if (btn) btn.click();
  }
  if (e.key === 'Enter' && e.target && e.target.id === 'dictIn') {
    const btn = document.querySelector('[data-act="checkdict"]');
    if (btn) btn.click();
  }
});

/* ---------- Boot ---------- */
S = load() || fresh();
ensurePool();
if (S.online && S.room) attachRoom(S.room);
if (S.flow && S.stage === 'play') ui.sheet = 'flow'; else S.flow = null;
render(); renderSheet();
</script>
