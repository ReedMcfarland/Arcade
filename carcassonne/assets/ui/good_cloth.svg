<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cloth-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#2a0808" flood-opacity="0.38" />
    </filter>
    <linearGradient id="cloth-main" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="45%" stop-color="#dc2626" />
      <stop offset="85%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="cloth-fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="cloth-under" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
  </defs>

  <g filter="url(#cloth-shadow)">
    <!-- Unrolled draped tail at bottom-right -->
    <path d="M 32 58 L 76 58 C 82 66 84 75 80 82 C 68 85 45 84 26 80 C 23 73 25 65 32 58 Z" fill="url(#cloth-under)" stroke="#450a0a" stroke-width="1.8" />
    <path d="M 30 62 C 44 65 62 65 76 62 C 78 68 78 73 75 78 C 60 80 42 80 28 76 C 27 71 28 66 30 62 Z" fill="url(#cloth-main)" />

    <!-- Main rolled bolt of crimson cloth -->
    <path d="M 22 30 C 22 22 32 18 46 18 L 74 24 C 82 26 84 36 80 48 C 76 58 66 63 52 63 L 24 56 C 17 52 16 40 22 30 Z" fill="url(#cloth-main)" stroke="#450a0a" stroke-width="2" />

    <!-- Soft fabric highlight & crease lines -->
    <path d="M 34 23 C 48 25 64 28 74 31" fill="none" stroke="#fca5a5" stroke-width="2" stroke-linecap="round" stroke-opacity="0.55" />
    <path d="M 28 38 C 44 42 60 45 73 48" fill="none" stroke="#7f1d1d" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.6" />

    <!-- Rolled spiral end on left -->
    <ellipse cx="26" cy="43" rx="9" ry="13.5" transform="rotate(-12, 26, 43)" fill="url(#cloth-fold)" stroke="#450a0a" stroke-width="1.8" />
    <path d="M 24 35 C 28 36 30 41 28 46 C 26 50 22 49 22 44 C 22 40 25 39 26 42" fill="none" stroke="#450a0a" stroke-width="1.6" stroke-linecap="round" />
  </g>
</svg>
