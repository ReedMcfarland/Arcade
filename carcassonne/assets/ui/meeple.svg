    </clipPath>

    <!-- Ambient directional lighting gradient (illuminates top-left, shades bottom-right) -->
    <linearGradient id="meeple-lighting-grad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.26" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.26" />
    </linearGradient>

    <!-- Tumbled wooden bevel: crisp rim highlight on top/left, soft occlusion rim on bottom -->
    <linearGradient id="meeple-rim-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.48" />
    </linearGradient>

    <!-- Radial dome specular highlight for head curvature -->
    <radialGradient id="meeple-head-glow" cx="46%" cy="18%" r="20%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Ambient Tabletop and Foot Contact Drop Shadows -->
  <g class="meeple-shadow">
    <ellipse cx="50" cy="87" rx="34" ry="4.8" fill="#000000" opacity="0.24" filter="url(#meeple-shadow-blur)" />
    <ellipse cx="24" cy="84.5" rx="11" ry="2.4" fill="#000000" opacity="0.32" filter="url(#meeple-contact-blur)" />
    <ellipse cx="76" cy="84.5" rx="11" ry="2.4" fill="#000000" opacity="0.32" filter="url(#meeple-contact-blur)" />
  </g>

