<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="pig-shadow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" />
    </filter>
    <filter id="pig-contact-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.0" />
    </filter>
    <!-- Classic Carcassonne Wooden Pig silhouette -->
    <clipPath id="pig-clip">
      <path d="M 22 44 C 22 33 33 27 48 27 C 56 27 63 29 68 32 C 70 27 73 22 76 22 C 78.5 22 79.5 26 78.5 32 C 82 35 84 39 85 43 L 89 45 C 91 46 91 53 89 55 L 83 56 C 81 60 77 63 73 65 L 74 78 C 74 80 72 81 69 81 H 64 C 62 81 61 80 61 78 L 60 68 C 56 69 51 69.5 46 69.5 C 42 69.5 39 69 36 68.5 L 35 78 C 35 80 33 81 30 81 H 25 C 23 81 22 80 22 78 L 23 64 C 19 60 16 55 15 49 C 12 48 10 45 10.5 42 C 11 39 14.5 38 16.5 40 C 17.5 41 16.5 43 15 43.5 C 16.5 45 19.5 45 22 44 Z" />
    </clipPath>
    <linearGradient id="pig-lighting-grad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.28" />
    </linearGradient>
    <linearGradient id="pig-rim-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="75%" stop-color="#000000" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45" />
    </linearGradient>
  </defs>

  <!-- Tabletop Shadow -->
  <g class="pig-shadow">
    <ellipse cx="50" cy="84.5" rx="32" ry="4.5" fill="#000000" opacity="0.24" filter="url(#pig-shadow-blur)" />
    <ellipse cx="28.5" cy="81.5" rx="8" ry="2.0" fill="#000000" opacity="0.30" filter="url(#pig-contact-blur)" />
    <ellipse cx="67.5" cy="81.5" rx="8" ry="2.0" fill="#000000" opacity="0.30" filter="url(#pig-contact-blur)" />
  </g>

  <!-- 3D Wooden Extrusion Under-Edge -->
  <path d="M 22 44 C 22 33 33 27 48 27 C 56 27 63 29 68 32 C 70 27 73 22 76 22 C 78.5 22 79.5 26 78.5 32 C 82 35 84 39 85 43 L 89 45 C 91 46 91 53 89 55 L 83 56 C 81 60 77 63 73 65 L 74 78 C 74 80 72 81 69 81 H 64 C 62 81 61 80 61 78 L 60 68 C 56 69 51 69.5 46 69.5 C 42 69.5 39 69 36 68.5 L 35 78 C 35 80 33 81 30 81 H 25 C 23 81 22 80 22 78 L 23 64 C 19 60 16 55 15 49 C 12 48 10 45 10.5 42 C 11 39 14.5 38 16.5 40 C 17.5 41 16.5 43 15 43.5 C 16.5 45 19.5 45 22 44 Z" transform="translate(0, 1.5)" fill="#000000" opacity="0.28" />

  <!-- Base Wooden Silhouette (Uses currentColor) -->
  <path id="pig-body" d="M 22 44 C 22 33 33 27 48 27 C 56 27 63 29 68 32 C 70 27 73 22 76 22 C 78.5 22 79.5 26 78.5 32 C 82 35 84 39 85 43 L 89 45 C 91 46 91 53 89 55 L 83 56 C 81 60 77 63 73 65 L 74 78 C 74 80 72 81 69 81 H 64 C 62 81 61 80 61 78 L 60 68 C 56 69 51 69.5 46 69.5 C 42 69.5 39 69 36 68.5 L 35 78 C 35 80 33 81 30 81 H 25 C 23 81 22 80 22 78 L 23 64 C 19 60 16 55 15 49 C 12 48 10 45 10.5 42 C 11 39 14.5 38 16.5 40 C 17.5 41 16.5 43 15 43.5 C 16.5 45 19.5 45 22 44 Z" fill="currentColor" />

  <!-- Tactile Surface Overlays -->
  <g clip-path="url(#pig-clip)">
    <rect width="100" height="100" fill="url(#pig-lighting-grad)" />
    <path d="M 22 44 C 22 33 33 27 48 27 C 56 27 63 29 68 32 C 70 27 73 22 76 22 C 78.5 22 79.5 26 78.5 32 C 82 35 84 39 85 43 L 89 45 C 91 46 91 53 89 55 L 83 56 C 81 60 77 63 73 65 L 74 78 C 74 80 72 81 69 81 H 64 C 62 81 61 80 61 78 L 60 68 C 56 69 51 69.5 46 69.5 C 42 69.5 39 69 36 68.5 L 35 78 C 35 80 33 81 30 81 H 25 C 23 81 22 80 22 78 L 23 64 C 19 60 16 55 15 49 C 12 48 10 45 10.5 42 C 11 39 14.5 38 16.5 40 C 17.5 41 16.5 43 15 43.5 C 16.5 45 19.5 45 22 44 Z" fill="none" stroke="url(#pig-rim-bevel)" stroke-width="2.2" />
  </g>
</svg>
