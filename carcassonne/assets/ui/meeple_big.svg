<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft diffuse floor shadow -->
    <filter id="big-meeple-shadow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4" />
    </filter>

    <!-- Ground contact shadow filter -->
    <filter id="big-meeple-contact-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.1" />
    </filter>

    <!-- Larger, broader Big Meeple silhouette -->
    <clipPath id="big-meeple-clip">
      <path id="big-meeple-path" d="M 50 6.5 c -5.8 0 -9.9 3.0 -12.3 6.8 -2.1 3.4 -3.0 7.3 -3.1 10.7 -6.4 3.1 -13.5 6.3 -19.2 9.5 -3.0 1.7 -5.6 3.4 -7.5 5.2 C 5.9 40.6 4.5 42.7 4.5 45.2 c 0 1.1 0.5 2.0 1.1 2.6 0.6 0.6 1.3 1.1 2.1 1.6 1.6 0.9 3.6 1.7 5.8 2.3 3.2 1.0 6.8 1.7 10.0 2.0 -3.1 5.4 -7.3 10.3 -10.9 15.1 C 8.3 74.3 4.5 79.6 4.5 85.4 c 0 0.9 0.0 1.5 0.1 2.2 0.1 0.7 0.3 1.5 0.9 2.1 0.7 0.7 1.5 0.8 2.2 0.9 0.7 0.1 1.3 0.1 2.2 0.1 h 23.2 c 1.7 0 2.9 0.1 4.2 -0.7 1.3 -0.8 1.8 -1.9 2.7 -3.6 l 0.0 -0.0 0.0 -0.0 s 2.0 -4.1 4.4 -8.2 c 1.2 -2.0 2.5 -4.1 3.7 -5.5 0.6 -0.7 1.1 -1.3 1.5 -1.6 0.1 -0.1 0.2 -0.1 0.4 -0.2 0.2 0.1 0.3 0.1 0.4 0.2 0.4 0.3 0.9 0.9 1.5 1.6 1.2 1.4 2.5 3.5 3.7 5.5 2.4 4.1 4.4 8.2 4.4 8.2 l 0.0 0.0 0.0 0.0 c 0.9 1.7 1.4 2.8 2.7 3.6 1.3 0.8 2.5 0.7 4.2 0.7 H 90.1 c 0.9 0 1.5 0.0 2.2 -0.1 0.7 -0.1 1.5 -0.2 2.2 -0.9 0.6 -0.6 0.8 -1.4 0.9 -2.1 0.1 -0.7 0.1 -1.3 0.1 -2.2 0 -5.8 -3.8 -11.1 -8.1 -16.6 -3.6 -4.8 -7.8 -9.7 -10.9 -15.1 3.2 -0.3 6.8 -1.0 10.0 -2.0 2.2 -0.6 4.2 -1.4 5.8 -2.3 0.8 -0.5 1.5 -1.0 2.1 -1.6 0.6 -0.6 1.1 -1.5 1.1 -2.6 0 -2.5 -1.4 -4.6 -3.4 -6.5 -1.9 -1.8 -4.5 -3.5 -7.5 -5.2 -5.7 -3.2 -12.8 -6.4 -19.2 -9.5 -0.1 -3.4 -1.0 -7.3 -3.1 -10.7 C 59.9 9.5 55.8 6.5 50 6.5 z" />
    </clipPath>

    <!-- Ambient directional lighting gradient -->
    <linearGradient id="big-meeple-lighting-grad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.28" />
    </linearGradient>

    <!-- Tumbled wooden bevel -->
    <linearGradient id="big-meeple-rim-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.60" />
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.50" />
    </linearGradient>

    <!-- Radial dome specular highlight for head curvature -->
    <radialGradient id="big-meeple-head-glow" cx="46%" cy="15%" r="22%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Ambient Tabletop and Foot Contact Drop Shadows -->
  <g class="meeple-shadow">
    <ellipse cx="50" cy="94" rx="40" ry="5.0" fill="#000000" opacity="0.26" filter="url(#big-meeple-shadow-blur)" />
    <ellipse cx="20" cy="91.5" rx="13" ry="2.6" fill="#000000" opacity="0.34" filter="url(#big-meeple-contact-blur)" />
    <ellipse cx="80" cy="91.5" rx="13" ry="2.6" fill="#000000" opacity="0.34" filter="url(#big-meeple-contact-blur)" />
  </g>

  <!-- 2. Thicker 3D Wooden Extrusion Under-Edge -->
  <use href="#big-meeple-path" transform="translate(0, 2.2)" fill="#000000" opacity="0.32" />

  <!-- 3. Base Wooden Silhouette (Uses currentColor) -->
  <use href="#big-meeple-path" fill="currentColor" />

  <!-- 4. Tactile Surface Overlays (Clipped to meeple body) -->
  <g clip-path="url(#big-meeple-clip)">
    <rect width="100" height="100" fill="url(#big-meeple-lighting-grad)" />

    <!-- Organic Beechwood Grain Fibers -->
    <g class="meeple-wood-grain" opacity="0.13">
      <path d="M 12 6 Q 15 48 11 92" stroke="#ffffff" stroke-width="0.7" fill="none" />
      <path d="M 21 6 Q 19 42 23 92" stroke="#000000" stroke-width="0.6" fill="none" />
      <path d="M 29 6 Q 32 50 28 92" stroke="#ffffff" stroke-width="0.7" fill="none" />
      <path d="M 38 6 Q 36 44 39 92" stroke="#000000" stroke-width="0.6" fill="none" />
      <path d="M 46 6 Q 49 52 45 92" stroke="#ffffff" stroke-width="0.8" fill="none" />
      <path d="M 54 6 Q 52 46 55 92" stroke="#000000" stroke-width="0.6" fill="none" />
      <path d="M 62 6 Q 66 54 61 92" stroke="#ffffff" stroke-width="0.7" fill="none" />
      <path d="M 71 6 Q 69 44 72 92" stroke="#000000" stroke-width="0.6" fill="none" />
      <path d="M 79 6 Q 82 48 78 92" stroke="#ffffff" stroke-width="0.7" fill="none" />
      <path d="M 88 6 Q 85 42 90 92" stroke="#000000" stroke-width="0.6" fill="none" />
    </g>

    <!-- Head curvature 3D dome highlight -->
    <circle cx="48" cy="16" r="19" fill="url(#big-meeple-head-glow)" />

    <!-- Subtle embossed crown/star emblem on chest to distinguish Big Meeple -->
    <g transform="translate(50, 48)">
      <path d="M 0 -9.5 L 2.7 -3.2 L 9.5 -2.6 L 4.3 1.9 L 5.9 8.6 L 0 5.0 L -5.9 8.6 L -4.3 1.9 L -9.5 -2.6 L -2.7 -3.2 Z"
            fill="#ffffff" fill-opacity="0.28" stroke="#000000" stroke-opacity="0.24" stroke-width="0.9" stroke-linejoin="round" />
    </g>
  </g>

  <!-- 5. Fine Boundary Stroke for Contrast Against Any Terrain -->
  <use href="#big-meeple-path" fill="none" stroke="#000000" stroke-opacity="0.22" stroke-width="0.9" stroke-linejoin="round" />

  <!-- 6. Tumbled Wooden Edge Bevel Highlight/Shadow -->
  <use href="#big-meeple-path" fill="none" stroke="url(#big-meeple-rim-bevel)" stroke-width="1.2" stroke-linejoin="round" />
</svg>
