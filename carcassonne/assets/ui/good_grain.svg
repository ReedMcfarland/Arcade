<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grain-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#2b1c03" flood-opacity="0.35" />
    </filter>
    <linearGradient id="wheat-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="wheat-stalk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
  </defs>

  <g filter="url(#grain-shadow)">
    <!-- Diagonal Golden Wheat Sheaf -->
    <g transform="rotate(28, 50, 50)">
      <!-- Lower stems -->
      <path d="M 44 58 L 40 86 M 48 58 L 47 88 M 52 58 L 53 88 M 56 58 L 60 86" stroke="url(#wheat-stalk)" stroke-width="3.2" stroke-linecap="round" />

      <!-- Center wheat ear -->
      <g fill="url(#wheat-gold)" stroke="#713f12" stroke-width="1.2">
        <ellipse cx="50" cy="18" rx="4" ry="7" />
        <ellipse cx="45" cy="26" rx="3.8" ry="6.2" transform="rotate(-22, 45, 26)" />
        <ellipse cx="55" cy="26" rx="3.8" ry="6.2" transform="rotate(22, 55, 26)" />
        <ellipse cx="44" cy="35" rx="4" ry="6.4" transform="rotate(-24, 44, 35)" />
        <ellipse cx="56" cy="35" rx="4" ry="6.4" transform="rotate(24, 56, 35)" />
        <ellipse cx="45" cy="44" rx="4" ry="6.4" transform="rotate(-20, 45, 44)" />
        <ellipse cx="55" cy="44" rx="4" ry="6.4" transform="rotate(20, 55, 44)" />
      </g>

      <!-- Left & Right flanking wheat ears -->
      <g fill="url(#wheat-gold)" stroke="#713f12" stroke-width="1.1">
        <ellipse cx="33" cy="30" rx="3.4" ry="5.5" transform="rotate(-18, 33, 30)" />
        <ellipse cx="36" cy="39" rx="3.6" ry="5.6" transform="rotate(-15, 36, 39)" />
        <ellipse cx="39" cy="48" rx="3.6" ry="5.6" transform="rotate(-12, 39, 48)" />

        <ellipse cx="67" cy="30" rx="3.4" ry="5.5" transform="rotate(18, 67, 30)" />
        <ellipse cx="64" cy="39" rx="3.6" ry="5.6" transform="rotate(15, 64, 39)" />
        <ellipse cx="61" cy="48" rx="3.6" ry="5.6" transform="rotate(12, 61, 48)" />
      </g>

      <!-- Binding ribbon/twine -->
      <rect x="41" y="55" width="18" height="6" rx="2.5" fill="#9a3412" stroke="#431407" stroke-width="1.4" />
      <line x1="43" y1="58" x2="57" y2="58" stroke="#fdba74" stroke-width="1" stroke-opacity="0.6" />
    </g>
  </g>
</svg>
