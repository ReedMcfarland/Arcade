<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and styling -->
  <defs>
    <radialGradient id="plazaCobble" cx="48%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#dfd0b5"/>
      <stop offset="65%" stop-color="#caa979"/>
      <stop offset="100%" stop-color="#af9165"/>
    </radialGradient>
    <linearGradient id="crossStone" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ede4d3"/>
      <stop offset="60%" stop-color="#d6c8b0"/>
      <stop offset="100%" stop-color="#9e8f77"/>
    </linearGradient>
  </defs>

  <!-- 1. Meadow Base Layer -->
  <rect width="100" height="100" fill="#77a851"/>

  <!-- Subtle Meadow Texture & Hill Shading -->
  <g opacity="0.45">
    <!-- Northwest meadow -->
    <circle cx="18" cy="18" r="16" fill="#84b85c"/>
    <circle cx="32" cy="12" r="12" fill="#659640"/>
    <circle cx="14" cy="32" r="11" fill="#6a9b44"/>
    <!-- Northeast meadow -->
    <circle cx="82" cy="18" r="16" fill="#80b457"/>
    <circle cx="68" cy="16" r="12" fill="#84b85c"/>
    <circle cx="84" cy="32" r="11" fill="#659640"/>
    <!-- Southwest meadow -->
    <circle cx="20" cy="80" r="16" fill="#6a9b44"/>
    <circle cx="32" cy="84" r="12" fill="#84b85c"/>
    <circle cx="14" cy="66" r="11" fill="#80b457"/>
    <!-- Southeast meadow -->
    <circle cx="80" cy="80" r="16" fill="#659640"/>
    <circle cx="68" cy="82" r="12" fill="#6a9b44"/>
    <circle cx="84" cy="68" r="11" fill="#84b85c"/>
  </g>

  <!-- Grass Tufts (Northwest Meadow) -->
  <g stroke="#48752c" stroke-width="1.1" stroke-linecap="round" fill="none">
    <path d="M 14 16 L 13 12.5 M 14 16 L 14.5 12 M 14 16 L 16 13"/>
    <path d="M 32 14 L 31 10.5 M 32 14 L 32.5 10 M 32 14 L 34 11"/>
    <path d="M 12 34 L 11 30.5 M 12 34 L 12.5 30 M 12 34 L 14 31"/>
    <path d="M 26 32 L 25 28.5 M 26 32 L 26.5 28 M 26 32 L 28 29"/>
  </g>

  <!-- Grass Tufts (Northeast Meadow) -->
  <g stroke="#48752c" stroke-width="1.1" stroke-linecap="round" fill="none">
    <path d="M 68 12 L 67 8.5 M 68 12 L 68.5 8 M 68 12 L 70 9"/>
    <path d="M 86 14 L 85 10.5 M 86 14 L 86.5 10 M 86 14 L 88 11"/>
    <path d="M 67 31 L 66 27.5 M 67 31 L 67.5 27 M 67 31 L 69 28"/>
    <path d="M 85 29 L 84 25.5 M 85 29 L 85.5 25 M 85 29 L 87 26"/>
  </g>

  <!-- Grass Tufts (Southwest Meadow) -->
  <g stroke="#48752c" stroke-width="1.1" stroke-linecap="round" fill="none">
    <path d="M 14 66 L 13 62.5 M 14 66 L 14.5 62 M 14 66 L 16 63"/>
    <path d="M 33 64 L 32 60.5 M 33 64 L 33.5 60 M 33 64 L 35 61"/>
    <path d="M 16 88 L 15 84.5 M 16 88 L 16.5 84 M 16 88 L 18 85"/>
    <path d="M 32 86 L 31 82.5 M 32 86 L 32.5 82 M 32 86 L 34 83"/>
  </g>

  <!-- Grass Tufts (Southeast Meadow) -->
  <g stroke="#48752c" stroke-width="1.1" stroke-linecap="round" fill="none">
    <path d="M 68 68 L 67 64.5 M 68 68 L 68.5 64 M 68 68 L 70 65"/>
    <path d="M 86 66 L 85 62.5 M 86 66 L 86.5 62 M 86 66 L 88 63"/>
    <path d="M 66 88 L 65 84.5 M 66 88 L 66.5 84 M 66 88 L 68 85"/>
    <path d="M 84 88 L 83 84.5 M 84 88 L 84.5 84 M 84 88 L 86 85"/>
  </g>

  <!-- Wildflowers in Meadows -->
  <g fill="#fef08a" opacity="0.85">
