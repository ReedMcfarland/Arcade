<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and styling -->
  <defs>
    <!-- City Ground / Terracotta Plaza -->
    <linearGradient id="cityGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cca06c"/>
      <stop offset="60%" stop-color="#c78d58"/>
      <stop offset="100%" stop-color="#b67f4a"/>
    </linearGradient>

    <!-- Roof Gradients -->
    <linearGradient id="roofRed1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cc523e"/>
      <stop offset="100%" stop-color="#993627"/>
    </linearGradient>
    <linearGradient id="roofRed2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ba4837"/>
      <stop offset="100%" stop-color="#84291c"/>
    </linearGradient>
    <linearGradient id="roofRed3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#db614c"/>
      <stop offset="100%" stop-color="#a63d2e"/>
    </linearGradient>
    <linearGradient id="roofRedDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a84031"/>
      <stop offset="100%" stop-color="#6f2015"/>
    </linearGradient>

    <!-- Stone Wall / Building Masonry -->
    <linearGradient id="sandstone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfcfb3"/>
      <stop offset="100%" stop-color="#c5b291"/>
    </linearGradient>
    <linearGradient id="sandstoneDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfbe9f"/>
      <stop offset="100%" stop-color="#a89474"/>
    </linearGradient>
    <linearGradient id="wallCoping" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e7d5"/>
      <stop offset="100%" stop-color="#baa88c"/>
    </linearGradient>
  </defs>

  <!-- 1. Meadow Base Layer -->
  <rect width="100" height="100" fill="#77a851"/>

  <!-- Meadow Texture & Hill Shading -->
  <g opacity="0.42">
    <!-- Broad West & Center Meadow Hillocks -->
    <circle cx="20" cy="56" r="22" fill="#6a9b44"/>
    <circle cx="22" cy="82" r="20" fill="#659640"/>
    <circle cx="50" cy="46" r="16" fill="#80b457"/>
    <circle cx="34" cy="35" r="15" fill="#84b85c"/>
    <circle cx="80" cy="36" r="13" fill="#80b457"/>
    <circle cx="35" cy="74" r="17" fill="#80b457"/>
    <!-- Inner Southeast Meadow Corner Hillock -->
    <circle cx="82" cy="82" r="16" fill="#6a9b44"/>
    <circle cx="90" cy="76" r="10" fill="#80b457"/>
  </g>

  <!-- Grass Tufts (Broad West and Center Meadow) -->
  <g stroke="#48752c" stroke-width="1.1" stroke-linecap="round" fill="none">
    <!-- Upper glade below city wall -->
    <path d="M 18 36 L 17 32.5 M 18 36 L 18.5 32 M 18 36 L 20 33.5"/>
    <path d="M 36 34 L 35 30.5 M 36 34 L 36.5 30 M 36 34 L 38 31.5"/>
    <path d="M 74 34 L 73 30.5 M 74 34 L 74.5 30 M 74 34 L 76 31.5"/>
    <path d="M 88 36 L 87 32.5 M 88 36 L 88.5 32 M 88 36 L 90 33.5"/>
    <!-- Mid-west & central meadow -->
    <path d="M 14 52 L 13 48.5 M 14 52 L 14.5 48 M 14 52 L 16 49.5"/>
    <path d="M 28 50 L 27 46.5 M 28 50 L 28.5 46 M 28 50 L 30 47.5"/>
    <path d="M 44 46 L 43 42.5 M 44 46 L 44.5 42 M 44 46 L 46 43.5"/>
    <path d="M 56 40 L 55 36.5 M 56 40 L 56.5 36 M 56 40 L 58 37.5"/>
    <!-- Lower-west & southwest meadow -->
    <path d="M 14 68 L 13 64.5 M 14 68 L 14.5 64 M 14 68 L 16 65.5"/>
    <path d="M 38 70 L 37 66.5 M 38 70 L 38.5 66 M 38 70 L 40 67.5"/>
    <path d="M 48 86 L 47 82.5 M 48 86 L 48.5 82 M 48 86 L 50 83.5"/>
    <path d="M 32 90 L 31 86.5 M 32 90 L 32.5 86 M 32 90 L 34 87.5"/>
    <path d="M 12 90 L 11 86.5 M 12 90 L 12.5 86 M 12 90 L 14 87.5"/>
  </g>

  <!-- Grass Tufts (Inner Southeast Corner Meadow) -->
  <g stroke="#48752c" stroke-width="1.1" stroke-linecap="round" fill="none">
    <path d="M 84 76 L 83 72.5 M 84 76 L 84.5 72 M 84 76 L 86 73.5"/>
    <path d="M 76 88 L 75 84.5 M 76 88 L 76.5 84 M 76 88 L 78 85.5"/>
    <path d="M 90 90 L 89 86.5 M 90 90 L 90.5 86 M 90 90 L 92 87.5"/>
  </g>

  <!-- Wildflowers (Broad West & Center Meadow) -->
  <!-- Yellow Buttercups -->
  <g fill="#fef08a" opacity="0.88">
    <circle cx="15" cy="38" r="0.9"/>
    <circle cx="34" cy="36" r="0.9"/>
    <circle cx="72" cy="35" r="0.9"/>
    <circle cx="86" cy="38" r="0.9"/>
    <circle cx="24" cy="52" r="0.9"/>
    <circle cx="48" cy="44" r="0.9"/>
    <circle cx="16" cy="65" r="0.9"/>
    <circle cx="36" cy="68" r="0.9"/>
    <circle cx="44" cy="88" r="0.9"/>
    <circle cx="28" cy="92" r="0.9"/>
  </g>
  <!-- White Daisies -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="20" cy="35" r="0.8"/>
    <circle cx="40" cy="36" r="0.8"/>
    <circle cx="78" cy="33" r="0.8"/>
    <circle cx="90" cy="35" r="0.8"/>
    <circle cx="18" cy="56" r="0.8"/>
    <circle cx="42" cy="48" r="0.8"/>
    <circle cx="12" cy="72" r="0.8"/>
    <circle cx="40" cy="74" r="0.8"/>
    <circle cx="38" cy="88" r="0.8"/>
    <circle cx="20" cy="94" r="0.8"/>
  </g>
  <!-- Red Poppies -->
  <g fill="#ef4444" opacity="0.85">
    <circle cx="18" cy="48" r="0.75"/>
    <circle cx="42" cy="54" r="0.75"/>
    <circle cx="15" cy="82" r="0.75"/>
    <circle cx="34" cy="82" r="0.75"/>
  </g>

  <!-- Wildflowers (Inner Southeast Corner Meadow) -->
  <g fill="#fef08a" opacity="0.88">
    <circle cx="80" cy="82" r="0.9"/>
    <circle cx="90" cy="84" r="0.9"/>
    <circle cx="76" cy="92" r="0.9"/>
  </g>
  <g fill="#ffffff" opacity="0.8">
    <circle cx="86" cy="76" r="0.8"/>
    <circle cx="82" cy="90" r="0.8"/>
    <circle cx="94" cy="88" r="0.8"/>
  </g>

  <!-- Tree Groves & Foliage in Broad Meadow -->
  <!-- Southwest Grove: (20, 78) -->
  <g id="grove-southwest">
    <ellipse cx="20" cy="80.5" rx="8.5" ry="4.2" fill="#3c5f21" opacity="0.4"/>
    <rect x="17.5" y="77" width="1.6" height="3.5" fill="#4d3826"/>
    <rect x="22.5" y="77.5" width="1.6" height="3" fill="#4d3826"/>
    <circle cx="17" cy="74" r="4.3" fill="#477528"/>
    <circle cx="23.5" cy="74.5" r="4.2" fill="#588c34"/>
    <circle cx="20.5" cy="71" r="4.6" fill="#67a13f"/>
    <circle cx="20" cy="69.5" r="2.4" fill="#7ebb4d" opacity="0.65"/>
  </g>

  <!-- West Orchard Tree: (32, 48) -->
  <g id="orchard-tree-west">
    <ellipse cx="32" cy="49.5" rx="5.5" ry="2.8" fill="#304a1b" opacity="0.32"/>
    <rect x="31.2" y="47" width="1.5" height="3" fill="#4d3826"/>
    <circle cx="29.5" cy="44.5" r="3.5" fill="#477528"/>
    <circle cx="34" cy="45" r="3.4" fill="#588c34"/>
    <circle cx="31.8" cy="42" r="3.8" fill="#67a13f"/>
    <circle cx="31.5" cy="40.8" r="1.8" fill="#84bd48" opacity="0.7"/>
    <!-- Apples -->
    <circle cx="30" cy="43" r="0.65" fill="#dc2626"/>
    <circle cx="33.5" cy="42.5" r="0.65" fill="#dc2626"/>
    <circle cx="32" cy="45.5" r="0.65" fill="#dc2626"/>
  </g>

  <!-- Shrub in Southeast Meadow Corner: (85, 84) -->
  <g id="bush-southeast">
    <ellipse cx="85" cy="85.5" rx="5.5" ry="3" fill="#3c5f21" opacity="0.35"/>
    <rect x="84.2" y="83.5" width="1.4" height="2.5" fill="#4d3826"/>
    <circle cx="83" cy="81.5" r="3" fill="#4a782a"/>
    <circle cx="87" cy="82" r="2.8" fill="#588c34"/>
    <circle cx="85" cy="79.5" r="3.2" fill="#67a13f"/>
    <circle cx="84.8" cy="78.2" r="1.7" fill="#7ebb4d" opacity="0.6"/>
  </g>

  <!-- 2. Curved East-to-South Road Layer -->
  <!-- Road Outer Casing (14px) connecting (100, 50) to (50, 100) -->
  <path d="M 100 50 Q 50 50 50 100" fill="none" stroke="#6f5c43" stroke-width="14" stroke-linecap="butt"/>

  <!-- Road Inner Surface (10px) -->
  <path d="M 100 50 Q 50 50 50 100" fill="none" stroke="#e4d6b7" stroke-width="10" stroke-linecap="butt"/>

  <!-- Dashed Centerline -->
  <path d="M 100 50 Q 50 50 50 100" fill="none" stroke="#bfaa88" stroke-width="1.3" stroke-dasharray="3.5 3.5" stroke-linecap="butt"/>

  <!-- Roadside Details (Pebbles & Verge Details) -->
  <g fill="#8d7b67" opacity="0.6">
    <!-- Outer verge pebbles (along meadow side) -->
    <circle cx="94" cy="41" r="0.8"/>
    <circle cx="82" cy="44" r="0.7"/>
    <circle cx="72" cy="49" r="0.8"/>
    <circle cx="58" cy="59" r="0.7"/>
    <circle cx="50" cy="72" r="0.8"/>
    <circle cx="48" cy="86" r="0.7"/>
    <circle cx="42" cy="94" r="0.8"/>
    <!-- Inner verge pebbles (along southeast corner side) -->
    <circle cx="94" cy="59" r="0.7"/>
    <circle cx="84" cy="63" r="0.8"/>
    <circle cx="73" cy="73" r="0.7"/>
    <circle cx="63" cy="84" r="0.8"/>
    <circle cx="59" cy="94" r="0.7"/>
  </g>

  <!-- 3. City Layer (North Cap: Spanning (0,0) to (100,0) down to ~y=25) -->
  <!-- City Wall Drop Shadow on Meadow -->
  <path d="M 0 8 Q 50 46 100 8" fill="none" stroke="#2d4219" stroke-width="4.5" opacity="0.34"/>

  <!-- City Ground Pavement / Terracotta Fill -->
  <path d="M 0 0 L 100 0 L 100 6 Q 50 44 0 6 Z" fill="url(#cityGround)"/>

  <!-- City Ground Cobblestone Texture Courses -->
  <path d="M 6 3 Q 50 14 94 3" fill="none" stroke="#aa713c" stroke-width="0.7" stroke-dasharray="2.5 3" opacity="0.45"/>
  <path d="M 12 7 Q 50 22 88 7" fill="none" stroke="#aa713c" stroke-width="0.7" stroke-dasharray="3 3.5" opacity="0.45"/>
  <path d="M 22 13 Q 50 32 78 13" fill="none" stroke="#aa713c" stroke-width="0.7" stroke-dasharray="3 4" opacity="0.45"/>

  <!-- Medieval City Architecture Inside the Cap -->
  <!-- Building 1: West House (x: 10..27) -->
  <g id="bldg-west-house">
    <rect x="11" y="4" width="16" height="8.5" rx="1" fill="url(#sandstone)" stroke="#594636" stroke-width="1"/>
    <rect x="10" y="2" width="18" height="8" rx="1.5" fill="url(#roofRed1)" stroke="#5e2a1e" stroke-width="1.1"/>
    <line x1="10" y1="6" x2="28" y2="6" stroke="#e36b57" stroke-width="0.7"/>
    <rect x="15" y="8" width="2" height="3" fill="#3e2a1c"/>
  </g>

  <!-- Building 2: West-Central Small Cottage (x: 23..33) -->
  <g id="bldg-west-cottage">
    <rect x="23" y="10" width="10" height="7.5" rx="1" fill="url(#sandstone)" stroke="#594636" stroke-width="0.9"/>
    <rect x="22" y="9" width="12" height="7" rx="1.2" fill="url(#roofRed2)" stroke="#5e2a1e" stroke-width="1"/>
    <line x1="22" y1="12.5" x2="34" y2="12.5" stroke="#db6350" stroke-width="0.6"/>
  </g>

  <!-- Building 3: Center Tower / Citadel Keep (x: 35..49) -->
  <g id="bldg-citadel-keep">
    <!-- Tower Body -->
    <rect x="36" y="6" width="13" height="13.5" rx="1" fill="url(#sandstone)" stroke="#594636" stroke-width="1.2"/>
    <!-- Arrow slit windows -->
    <rect x="42" y="10" width="1.6" height="3.5" rx="0.5" fill="#3a271a"/>
    <rect x="42" y="15" width="1.6" height="2.5" rx="0.4" fill="#3a271a"/>
    <!-- Tower Corbeling -->
    <rect x="35" y="5.5" width="15" height="1.8" fill="#e2d3b8" stroke="#594636" stroke-width="0.7"/>
    <!-- Conical / Hipped Roof -->
    <polygon points="34,5.5 42.5,-1 51,5.5" fill="url(#roofRed1)" stroke="#5e2a1e" stroke-width="1.1"/>
    <!-- Roof shadow facet -->
    <polygon points="42.5,-1 51,5.5 42.5,5.5" fill="#752217" opacity="0.4"/>
    <circle cx="42.5" cy="-1" r="1.1" fill="#c99738"/>
  </g>

  <!-- Building 4: Central Great Hall (x: 50..70) -->
  <g id="bldg-great-hall">
    <!-- Hall Walls -->
    <rect x="52" y="7" width="18" height="10" rx="1" fill="url(#sandstone)" stroke="#594636" stroke-width="1.1"/>
    <!-- Arched Entrance -->
    <path d="M 59 17 L 59 13 Q 61 11.5 63 13 L 63 17 Z" fill="#3a271a"/>
    <!-- Gable Roof -->
    <rect x="50.5" y="4.5" width="21" height="8.5" rx="1.5" fill="url(#roofRed3)" stroke="#5e2a1e" stroke-width="1.1"/>
    <line x1="50.5" y1="8.8" x2="71.5" y2="8.8" stroke="#f07965" stroke-width="0.8"/>
    <!-- Dormer Window -->
    <polygon points="58,5 60.5,2.5 63,5" fill="#993627" stroke="#5e2a1e" stroke-width="0.7"/>
    <rect x="59.5" y="4.5" width="2" height="2" fill="#3a271a"/>
  </g>

  <!-- Building 5: East House & Workshop (x: 72..89) -->
  <g id="bldg-east-workshop">
    <rect x="73" y="4.5" width="15" height="8" rx="1" fill="url(#sandstone)" stroke="#594636" stroke-width="1"/>
    <rect x="72" y="2.5" width="17" height="7.5" rx="1.5" fill="url(#roofRed1)" stroke="#5e2a1e" stroke-width="1.1"/>
    <line x1="72" y1="6.2" x2="89" y2="6.2" stroke="#e36b57" stroke-width="0.7"/>
    <!-- Chimney & Smoke -->
    <rect x="85" y="0.5" width="2.2" height="3" fill="#b44737" stroke="#5e2a1e" stroke-width="0.6"/>
    <path d="M 86 0.5 Q 87 -0.8 85.5 -2" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- Building 6: East Cottage (x: 66..76) -->
  <g id="bldg-east-cottage">
    <rect x="67" y="11" width="10" height="7.5" rx="1" fill="url(#sandstone)" stroke="#594636" stroke-width="0.9"/>
    <rect x="66" y="9.5" width="11" height="7" rx="1.2" fill="url(#roofRed2)" stroke="#5e2a1e" stroke-width="1"/>
    <line x1="66" y1="13" x2="77" y2="13" stroke="#d65e4c" stroke-width="0.6"/>
  </g>

  <!-- Stone City Wall & Battlements Structure (Apex at y=25) -->
  <!-- Outer Stone Wall Base Stroke -->
  <path d="M 0 6 Q 50 44 100 6" fill="none" stroke="#594636" stroke-width="5" stroke-linecap="butt"/>
  <!-- Wall Walkway Stone Course -->
  <path d="M 0 6 Q 50 44 100 6" fill="none" stroke="#9e8d79" stroke-width="2.6" stroke-linecap="butt"/>
  <!-- Battlements / Merlons Pattern -->
  <path d="M 0 6 Q 50 44 100 6" fill="none" stroke="#594636" stroke-width="2.6" stroke-dasharray="3.2 2.2" stroke-linecap="butt"/>
  <!-- Wall Coping Stone Sunlit Highlights -->
  <path d="M 0 5.1 Q 50 43.1 100 5.1" fill="none" stroke="#ded5c4" stroke-width="1.1" stroke-dasharray="3.2 2.2" stroke-linecap="butt"/>

  <!-- Turrets / Defensive Bastions at Wall Ends (0, 6) and (100, 6) -->
  <circle cx="2" cy="7" r="3.2" fill="#9e8d79" stroke="#594636" stroke-width="1.2"/>
  <circle cx="98" cy="7" r="3.2" fill="#9e8d79" stroke="#594636" stroke-width="1.2"/>
  <circle cx="2" cy="7" r="1.4" fill="#3a271a"/>
  <circle cx="98" cy="7" r="1.4" fill="#3a271a"/>

  <!-- 4. Clean Perimeter Border -->
  <rect x="0.5" y="0.5" width="99" height="99" fill="none" stroke="rgba(35,24,15,0.3)" stroke-width="1" rx="2"/>
</svg>
