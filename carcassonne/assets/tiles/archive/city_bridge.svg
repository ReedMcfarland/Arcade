    <polygon points="63,69 65,71.5 67,69" fill="#993627" stroke="#5e2a1e" stroke-width="0.6"/>
  </g>

  <!-- Building NE1: Great Spanned Hall (x: 72..87) -->
  <g>
    <rect x="72" y="18" width="15" height="10" rx="1" fill="url(#sandstone)" stroke="#594636" stroke-width="1"/>
