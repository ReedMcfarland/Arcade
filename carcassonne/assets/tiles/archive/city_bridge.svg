    <circle cx="50" cy="50" r="3.4" fill="url(#sandstone)" stroke="#594636" stroke-width="0.9"/>
    <circle cx="50" cy="50" r="2.3" fill="url(#waterWell)"/>
    <circle cx="49.5" cy="49.5" r="1.6" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.6"/>
    <!-- Well Timber Canopy Supports -->
    <line x1="48.2" y1="47.5" x2="48.2" y2="52" stroke="#4d3826" stroke-width="0.8"/>
    <line x1="51.8" y1="47.5" x2="51.8" y2="52" stroke="#4d3826" stroke-width="0.8"/>
    <polygon points="47,47.5 50,45 53,47.5" fill="#993627" stroke="#5e2a1e" stroke-width="0.6"/>
  </g>

