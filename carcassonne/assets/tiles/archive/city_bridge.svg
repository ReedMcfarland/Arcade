  <path d="M 0 8 Q 50 52 100 8 L 100 92 Q 50 48 0 92 Z" fill="url(#cityGround)"/>

  <!-- Plaza Central Tonal Shading -->
  <ellipse cx="50" cy="50" rx="22" ry="14" fill="url(#plazaCenter)" opacity="0.55"/>

  <!-- Cobblestone Texture & Street Paths -->
