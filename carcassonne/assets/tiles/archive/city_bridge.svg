  <path d="M 4 32 Q 50 40 96 32" fill="none" stroke="#9c6d3d" stroke-width="0.8" stroke-dasharray="3 3.5" opacity="0.45"/>
  <path d="M 4 68 Q 50 60 96 68" fill="none" stroke="#9c6d3d" stroke-width="0.8" stroke-dasharray="3 3.5" opacity="0.45"/>
  <path d="M 6 20 Q 50 32 94 20" fill="none" stroke="#aa713c" stroke-width="0.7" stroke-dasharray="2.5 3" opacity="0.35"/>
  <path d="M 6 80 Q 50 68 94 80" fill="none" stroke="#aa713c" stroke-width="0.7" stroke-dasharray="2.5 3" opacity="0.35"/>

