  <!-- 7. North Stone City Wall & Battlements -->
  <g id="north-city-wall">
    <!-- Outer Stone Wall Base Stroke -->
    <path d="M 0 8 Q 50 52 100 8" fill="none" stroke="#594636" stroke-width="5" stroke-linecap="butt"/>
    <!-- Wall Walkway Stone Course -->
    <path d="M 0 8 Q 50 52 100 8" fill="none" stroke="#9e8d79" stroke-width="2.6" stroke-linecap="butt"/>
    <!-- Battlements / Merlons Pattern -->
    <path d="M 0 8 Q 50 52 100 8" fill="none" stroke="#594636" stroke-width="2.6" stroke-dasharray="3.2 2.2" stroke-linecap="butt"/>
    <!-- Highlight on Battlements -->
    <path d="M 0 7.1 Q 50 51.1 100 7.1" fill="none" stroke="#ded5c4" stroke-width="1.1" stroke-dasharray="3.2 2.2" stroke-linecap="butt"/>

    <!-- Intermediate Flanking Bastions along North Wall -->
    <g>
      <circle cx="30" cy="26.5" r="3.2" fill="#9e8d79" stroke="#594636" stroke-width="1.2"/>
      <circle cx="30" cy="26.5" r="1.3" fill="#3a271a"/>
      <circle cx="70" cy="26.5" r="3.2" fill="#9e8d79" stroke="#594636" stroke-width="1.2"/>
      <circle cx="70" cy="26.5" r="1.3" fill="#3a271a"/>
    </g>

    <!-- Turrets at North Wall Ends -->
    <circle cx="2" cy="8" r="3.2" fill="#9e8d79" stroke="#594636" stroke-width="1.2"/>
    <circle cx="98" cy="8" r="3.2" fill="#9e8d79" stroke="#594636" stroke-width="1.2"/>
    <circle cx="2" cy="8" r="1.3" fill="#3a271a"/>
    <circle cx="98" cy="8" r="1.3" fill="#3a271a"/>
  </g>

