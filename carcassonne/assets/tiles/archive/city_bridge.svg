      <circle cx="48.5" cy="11" r="2.8" fill="#4a782a"/>
      <circle cx="51.5" cy="11.5" r="2.4" fill="#588c34"/>
      <circle cx="50" cy="9.8" r="2.5" fill="#67a13f"/>
      <circle cx="49.5" cy="9.2" r="1.4" fill="#88cc44" opacity="0.7"/>
