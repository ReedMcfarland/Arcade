    <!-- Outer Stone Wall Base Stroke -->
    <path d="M 0 92 Q 50 48 100 92" fill="none" stroke="#594636" stroke-width="5" stroke-linecap="butt"/>
    <!-- Wall Walkway Stone Course -->
    <path d="M 0 92 Q 50 48 100 92" fill="none" stroke="#9e8d79" stroke-width="2.6" stroke-linecap="butt"/>
    <!-- Battlements / Merlons Pattern -->
    <path d="M 0 92 Q 50 48 100 92" fill="none" stroke="#594636" stroke-width="2.6" stroke-dasharray="3.2 2.2" stroke-linecap="butt"/>
    <!-- Highlight on Battlements -->
    <path d="M 0 92.9 Q 50 48.9 100 92.9" fill="none" stroke="#ded5c4" stroke-width="1.1" stroke-dasharray="3.2 2.2" stroke-linecap="butt"/>

    <!-- Intermediate Flanking Bastions along South Wall -->
    <g>
      <circle cx="30" cy="73.5" r="3.2" fill="#9e8d79" stroke="#594636" stroke-width="1.2"/>
      <circle cx="30" cy="73.5" r="1.3" fill="#3a271a"/>
      <circle cx="70" cy="73.5" r="3.2" fill="#9e8d79" stroke="#594636" stroke-width="1.2"/>
      <circle cx="70" cy="73.5" r="1.3" fill="#3a271a"/>
    </g>

    <!-- Turrets at South Wall Ends -->
    <circle cx="2" cy="92" r="3.2" fill="#9e8d79" stroke="#594636" stroke-width="1.2"/>
    <circle cx="98" cy="92" r="3.2" fill="#9e8d79" stroke="#594636" stroke-width="1.2"/>
    <circle cx="2" cy="92" r="1.3" fill="#3a271a"/>
    <circle cx="98" cy="92" r="1.3" fill="#3a271a"/>
  </g>

  <!-- 9. Clean Perimeter Border -->
  <rect x="0.5" y="0.5" width="99" height="99" fill="none" stroke="rgba(35,24,15,0.3)" stroke-width="1" rx="2"/>
</svg>
