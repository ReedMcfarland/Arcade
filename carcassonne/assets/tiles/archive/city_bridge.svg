  <!-- South Wall Drop Shadow -->
  <path d="M 0 93.5 Q 50 49.5 100 93.5" fill="none" stroke="#364e1e" stroke-width="4.5" opacity="0.3"/>

  <!-- 5. City Bridge Pavement Layer -->
