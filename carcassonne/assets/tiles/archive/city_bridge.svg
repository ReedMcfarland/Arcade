      <circle cx="72.5" cy="9.5" r="2.8" fill="#7bb342"/>
      <circle cx="81.5" cy="11" r="4.8" fill="#477528"/>
      <circle cx="81" cy="10" r="4" fill="#588c34"/>
      <circle cx="80.5" cy="9" r="2.8" fill="#7ebb4d"/>
      <circle cx="77" cy="8.5" r="4.2" fill="#67a13f"/>
      <circle cx="76.5" cy="7.5" r="2.5" fill="#88cc44" opacity="0.7"/>
    </g>

    <!-- Shrub Cluster North Center -->
