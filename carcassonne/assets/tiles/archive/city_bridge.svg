    <!-- Ground Gradients -->
    <linearGradient id="cityGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cca06c"/>
      <stop offset="50%" stop-color="#c78d58"/>
      <stop offset="100%" stop-color="#b67f4a"/>
    </linearGradient>
    <radialGradient id="plazaCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d6ab76"/>
      <stop offset="100%" stop-color="#ba824e"/>
    </radialGradient>

    <!-- Roof Gradients -->
    <linearGradient id="roofRed1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cc523e"/>
      <stop offset="100%" stop-color="#993627"/>
    </linearGradient>
    <linearGradient id="roofRed2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ba4837"/>
      <stop offset="100%" stop-color="#84291c"/>
