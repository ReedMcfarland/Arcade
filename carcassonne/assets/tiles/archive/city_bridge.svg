    <rect x="27" y="24.5" width="12" height="7" rx="1.2" fill="url(#roofRed3)" stroke="#5e2a1e" stroke-width="1"/>
    <line x1="27" y1="28" x2="39" y2="28" stroke="#f07965" stroke-width="0.6"/>
    <rect x="32" y="30" width="2" height="4" fill="#3a271a"/>
  </g>

