<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 1. Meadow Base Layer -->
  <rect width="100" height="100" fill="#77a851"/>

  <!-- Subtle Meadow Texture & Hill Shading -->
  <g opacity="0.45">
    <circle cx="18" cy="25" r="22" fill="#84b85c"/>
    <circle cx="26" cy="80" r="24" fill="#6a9b44"/>
    <circle cx="82" cy="28" r="20" fill="#659640"/>
    <circle cx="78" cy="76" r="22" fill="#80b457"/>
    <circle cx="12" cy="52" r="14" fill="#659640"/>
    <circle cx="88" cy="52" r="14" fill="#84b85c"/>
  </g>

  <!-- Grass Tufts (West Meadow) -->
  <g stroke="#48752c" stroke-width="1.1" stroke-linecap="round" fill="none">
    <!-- tuft at (14, 18) -->
    <path d="M 14 18 L 13 14.5 M 14 18 L 14.5 14 M 14 18 L 16 15"/>
    <!-- tuft at (34, 12) -->
    <path d="M 34 12 L 33 8.5 M 34 12 L 34.5 8 M 34 12 L 36 9"/>
    <!-- tuft at (12, 42) -->
    <path d="M 12 42 L 11 38.5 M 12 42 L 12.5 38 M 12 42 L 14 39"/>
    <!-- tuft at (36, 52) -->
    <path d="M 36 53 L 35 49.5 M 36 53 L 36.5 49 M 36 53 L 38 50"/>
    <!-- tuft at (15, 68) -->
    <path d="M 15 68 L 14 64.5 M 15 68 L 15.5 64 M 15 68 L 17 65"/>
    <!-- tuft at (38, 88) -->
    <path d="M 38 88 L 37 84.5 M 38 88 L 38.5 84 M 38 88 L 40 85"/>
    <!-- tuft at (18, 92) -->
    <path d="M 18 92 L 17 88.5 M 18 92 L 18.5 88 M 18 92 L 20 89"/>
  </g>

  <!-- Grass Tufts (East Meadow) -->
  <g stroke="#48752c" stroke-width="1.1" stroke-linecap="round" fill="none">
    <!-- tuft at (64, 14) -->
    <path d="M 64 14 L 63 10.5 M 64 14 L 64.5 10 M 64 14 L 66 11"/>
    <!-- tuft at (86, 18) -->
    <path d="M 86 18 L 85 14.5 M 86 18 L 86.5 14 M 86 18 L 88 15"/>
    <!-- tuft at (65, 48) -->
    <path d="M 65 48 L 64 44.5 M 65 48 L 65.5 44 M 65 48 L 67 45"/>
    <!-- tuft at (88, 56) -->
    <path d="M 88 56 L 87 52.5 M 88 56 L 88.5 52 M 88 56 L 90 53"/>
    <!-- tuft at (64, 82) -->
    <path d="M 64 82 L 63 78.5 M 64 82 L 64.5 78 M 64 82 L 66 79"/>
    <!-- tuft at (82, 88) -->
    <path d="M 82 88 L 81 84.5 M 82 88 L 82.5 84 M 82 88 L 84 85"/>
  </g>

  <!-- Wildflowers in Meadows -->
  <g fill="#fef08a" opacity="0.85">
    <circle cx="16" cy="22" r="0.9"/>
    <circle cx="32" cy="16" r="0.9"/>
    <circle cx="10" cy="46" r="0.9"/>
    <circle cx="34" cy="56" r="0.9"/>
    <circle cx="18" cy="72" r="0.9"/>
    <circle cx="36" cy="84" r="0.9"/>
    <circle cx="68" cy="16" r="0.9"/>
    <circle cx="84" cy="22" r="0.9"/>
    <circle cx="66" cy="52" r="0.9"/>
    <circle cx="86" cy="60" r="0.9"/>
    <circle cx="68" cy="85" r="0.9"/>
    <circle cx="86" cy="84" r="0.9"/>
  </g>
  <g fill="#ffffff" opacity="0.75">
    <circle cx="20" cy="19" r="0.8"/>
    <circle cx="14" cy="40" r="0.8"/>
    <circle cx="38" cy="50" r="0.8"/>
    <circle cx="13" cy="65" r="0.8"/>
    <circle cx="40" cy="86" r="0.8"/>
    <circle cx="62" cy="12" r="0.8"/>
    <circle cx="88" cy="15" r="0.8"/>
    <circle cx="63" cy="46" r="0.8"/>
    <circle cx="90" cy="53" r="0.8"/>
    <circle cx="62" cy="80" r="0.8"/>
    <circle cx="80" cy="91" r="0.8"/>
  </g>

  <!-- Foliage / Trees on West Meadow -->
  <!-- Grove West-North: (24, 28) -->
  <g>
    <ellipse cx="24" cy="30" rx="9" ry="4.8" fill="#3c5f21" opacity="0.4"/>
    <rect x="21" y="27" width="1.6" height="3.5" fill="#4d3826"/>
    <rect x="26" y="27.5" width="1.6" height="3" fill="#4d3826"/>
    <circle cx="20" cy="24.5" r="4.6" fill="#477528"/>
    <circle cx="27.5" cy="24" r="5" fill="#588c34"/>
    <circle cx="23.5" cy="21.5" r="4.8" fill="#67a13f"/>
    <circle cx="23" cy="20" r="2.5" fill="#7ebb4d" opacity="0.65"/>
  </g>

  <!-- Single Tree West-South: (22, 76) -->
  <g>
    <ellipse cx="22" cy="78" rx="7.5" ry="4" fill="#3c5f21" opacity="0.4"/>
    <rect x="21" y="75" width="1.6" height="3" fill="#4d3826"/>
    <circle cx="19" cy="72" r="4" fill="#4a782a"/>
    <circle cx="24" cy="73" r="3.5" fill="#588c34"/>
    <circle cx="21.5" cy="69.5" r="4.2" fill="#67a13f"/>
    <circle cx="21" cy="68" r="2.2" fill="#7ebb4d" opacity="0.6"/>
  </g>

  <!-- Shrub / Bush West-Mid: (10, 56) -->
  <g>
    <ellipse cx="10" cy="57" rx="4.5" ry="2.5" fill="#3c5f21" opacity="0.35"/>
    <circle cx="8.5" cy="55" r="2.5" fill="#4e7f2b"/>
    <circle cx="11.5" cy="54.5" r="2.8" fill="#5f9736"/>
    <circle cx="10" cy="53" r="2" fill="#7ebb4d" opacity="0.6"/>
  </g>

  <!-- Foliage / Trees on East Meadow -->
  <!-- Grove East-Mid: (78, 42) -->
  <g>
    <ellipse cx="78" cy="44" rx="9" ry="4.8" fill="#3c5f21" opacity="0.4"/>
    <rect x="75" y="41" width="1.6" height="3.5" fill="#4d3826"/>
    <rect x="80" y="41.5" width="1.6" height="3" fill="#4d3826"/>
    <circle cx="74" cy="38.5" r="4.6" fill="#477528"/>
    <circle cx="81.5" cy="38" r="5" fill="#588c34"/>
    <circle cx="77.5" cy="35.5" r="4.8" fill="#67a13f"/>
    <circle cx="77" cy="34" r="2.5" fill="#7ebb4d" opacity="0.65"/>
  </g>

  <!-- Single Tree East-North: (76, 16) -->
  <g>
    <ellipse cx="76" cy="18" rx="6.5" ry="3.5" fill="#3c5f21" opacity="0.4"/>
    <rect x="75.2" y="15" width="1.5" height="3" fill="#4d3826"/>
    <circle cx="73.5" cy="13" r="3.6" fill="#4a782a"/>
    <circle cx="78" cy="13.5" r="3.2" fill="#588c34"/>
    <circle cx="75.8" cy="10.8" r="3.8" fill="#67a13f"/>
    <circle cx="75.5" cy="9.5" r="2" fill="#7ebb4d" opacity="0.6"/>
  </g>

  <!-- Tree East-South: (80, 78) -->
  <g>
    <ellipse cx="80" cy="80" rx="8" ry="4.2" fill="#3c5f21" opacity="0.4"/>
    <rect x="79" y="77" width="1.6" height="3" fill="#4d3826"/>
    <circle cx="77" cy="74" r="4.2" fill="#477528"/>
    <circle cx="83" cy="74.5" r="3.8" fill="#588c34"/>
    <circle cx="80" cy="71.5" r="4.4" fill="#67a13f"/>
    <circle cx="79.5" cy="70" r="2.3" fill="#7ebb4d" opacity="0.6"/>
  </g>

  <!-- 2. Straight North-South Road Layer -->
  <!-- Road Edge Shadow / Casing (14px) -->
  <path d="M 50 0 L 50 100" fill="none" stroke="#6f5c43" stroke-width="14" stroke-linecap="butt"/>

  <!-- Road Inner Surface (10px) -->
  <path d="M 50 0 L 50 100" fill="none" stroke="#e4d6b7" stroke-width="10" stroke-linecap="butt"/>

  <!-- Road Shoulder Highlights & Subtle Ruts -->
  <path d="M 45.2 0 L 45.2 100" fill="none" stroke="#d5c49f" stroke-width="0.6" opacity="0.7"/>
  <path d="M 54.8 0 L 54.8 100" fill="none" stroke="#c9b78e" stroke-width="0.6" opacity="0.7"/>

  <!-- Dashed Centerline -->
  <path d="M 50 0 L 50 100" fill="none" stroke="#bfaa88" stroke-width="1.3" stroke-dasharray="3.5 3.5" stroke-linecap="butt"/>

  <!-- Roadside Details (Pebbles & Verge Grass) -->
  <g fill="#93816c" opacity="0.6">
    <circle cx="42" cy="22" r="0.8"/>
    <circle cx="42.5" cy="64" r="0.7"/>
    <circle cx="57.5" cy="38" r="0.7"/>
    <circle cx="58" cy="78" r="0.9"/>
  </g>

  <!-- 3. Clean Perimeter Border -->
  <rect x="0.5" y="0.5" width="99" height="99" fill="none" stroke="rgba(35,24,15,0.3)" stroke-width="1" rx="2"/>
</svg>
