name: Deploy Arcade to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Run Carcassonne tests
        working-directory: carcassonne
        run: cargo test

      - name: Build Carcassonne WebAssembly package
        working-directory: carcassonne
        run: wasm-pack build --target web --release

      - name: Assemble static distribution
        run: |
          mkdir -p dist/carcassonne
          cp A_Little_Wordy.html seeded_wordy_multiplayer.html Words.txt dist/
          cp carcassonne/index.html dist/carcassonne/
          cp -r carcassonne/css dist/carcassonne/
          cp -r carcassonne/js dist/carcassonne/
          cp -r carcassonne/assets dist/carcassonne/
          cp -r carcassonne/pkg dist/carcassonne/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
